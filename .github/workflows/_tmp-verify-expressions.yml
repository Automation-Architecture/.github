name: TEMP verify expressions (DELETE BEFORE MERGE)

# Temporary. Proves the #21 review fixes against GitHub's REAL expression engine
# on this branch (workflow_dispatch would need the file on main first, but a
# push trigger runs anywhere). Deleted before merge.

on:
  push:
    branches: [security/gitleaks-org-wide]

permissions:
  contents: read

jobs:
  ternary:
    name: fetch-depth ternary semantics
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate both forms
        run: |
          set -euo pipefail
          old="${{ true && 0 || 1 }}"
          new_true="${{ true && '0' || '1' }}"
          new_false="${{ false && '0' || '1' }}"
          echo "unquoted (old, buggy) true  -> '$old'       (expect 1 == the bug)"
          echo "quoted   (new, fixed) true  -> '$new_true'  (expect 0 == full history)"
          echo "quoted   (new, fixed) false -> '$new_false' (expect 1 == shallow)"
          [ "$old" = "1" ]       || { echo "UNEXPECTED: old=$old"; exit 1; }
          [ "$new_true" = "0" ]  || { echo "FAIL: new_true=$new_true"; exit 1; }
          [ "$new_false" = "1" ] || { echo "FAIL: new_false=$new_false"; exit 1; }
          echo "OK: unquoted collapses to 1 in BOTH branches (bug reproduced); quoted yields 0/1 (fix confirmed)"

  history_fixed:
    name: checkout with FIXED expression fetches full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ true && '0' || '1' }}
      - run: |
          set -euo pipefail
          n=$(git rev-list --count HEAD)
          echo "commits fetched with FIXED expression: $n"
          [ "$n" -gt 1 ] || { echo "FAIL: still shallow -> history scan would be blind"; exit 1; }
          echo "OK: full history present"

  history_buggy_control:
    name: control - buggy expression is shallow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ true && 0 || 1 }}
      - run: |
          set -euo pipefail
          n=$(git rev-list --count HEAD)
          echo "commits fetched with BUGGY expression: $n (expect 1 = shallow, proving the bug was real)"

  injection:
    name: env-var pattern resists injection
    runs-on: ubuntu-latest
    env:
      ONLY_REPO: 'x"; touch /tmp/pwned; echo "'
    steps:
      - name: Hostile input must be data, not code
        run: |
          set -euo pipefail
          printf 'Automation-Architecture/%s\n' "$ONLY_REPO" > repos.txt
          echo "repos.txt contents:"; cat repos.txt
          if [ -f /tmp/pwned ]; then echo "FAIL: injection executed"; exit 1; fi
          echo "OK: hostile value treated as a literal string"
