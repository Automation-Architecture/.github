name: Auto-Merge when Checks Green and Reviews In

# Squash-merges a PR once check-runs on the HEAD SHA are green, Codex has
# reviewed THAT head, and no P0/P1 Codex finding is open. A PR Codex has not
# reviewed at its current head is HELD. It is never merged unreviewed.
#
# ── POLICY (Brad, 2026-09-29) ──────────────────────────────────────────────
# Codex is the one reviewer. Greptile is outside the merge policy: its check
# is ignored by Gate 1, it is never Gate 2 evidence, and its threads never
# block. No human approval is required anywhere, and no human review decision
# or thread ever blocks: a CHANGES_REQUESTED is not read (2026-09-29). The
# merge threshold: Codex reviewed the current head, no P0/P1 Codex finding is
# open, CI is green. P2/P3 findings do not block.
#
# ── Gate 0: never auto-merge a PR that edits the reviewer (2026-09-16) ────
# Ported from the aaa-client-dashboard pilot (#235) for AAA-711 / .github#31.
# These files instruct the reviewer or this gate. A PR that changes them can
# suppress the review judging it: an added "scope restrictions" section in
# CLAUDE.md/AGENTS.md is a demonstrated way to silence a finding, and the
# reviewers import those files as review context. A PR editing auto-merge.yml is the
# same problem one level up. Humans merge these, deliberately, via aaa-merge.
#
# Guarded paths: CLAUDE.md, AGENTS.md, .cursorrules, .claude/, .greptile/,
# and .github/workflows/auto-merge.yml. Matched on both the new and previous
# filename so a rename cannot dodge it (AGENTS.md -> docs/notes.md otherwise
# shows only its unguarded destination). Fail CLOSED if the file list is
# unreadable: masking a gh/API failure as "no guarded files" would let
# exactly the PR this gate exists for through.
#
# The list-PR-files endpoint returns at most 3000 files. `gh --paginate`
# stops when GitHub reports no further pages, so a truncated set still
# looks like a successful complete list. Gate 0 therefore compares the
# returned object count to `.changed_files` and HOLDS if they differ, and
# HOLDS at `changed_files >= 3000` even when the counts match — we cannot
# tell a complete 3000-file PR from a truncated larger one. A truncated
# list is never treated as "no guarded paths".
#
# Bound to BOTH head and base. The file list is the effective diff against
# the PR's current base. GitHub's merge API has no expectedBaseOid;
# `gh pr merge --match-head-commit` only pins the head. Pinning the base
# by a local squash + `git push --force-with-lease=refs/heads/<base>:<sha>`
# is deliberately NOT used: this workflow is the org-wide canonical
# auto-merge, it must not --admin, and a direct push to the default branch
# would bypass per-repo rulesets (required PRs, required checks).
#
# Strongest close that still respects those rulesets:
#   1. Last head+base re-read and Gate 0 re-check run just before merge.
#      Only the final snapshot (2026-09-18, below) sits between the lock
#      and the merge: it reads the signals that have no pin and no
#      after-the-fact detection, and a base move in that window is still
#      caught by check 2.
#   2. After a successful squash, confirm the new commit's parent is the
#      locked base SHA. A mismatch is a hard ::error:: (retarget or base
#      movement between lock and merge). This job then fails. We cannot
#      unmerge.
#
# Residual TOCTOU (accepted, detected after the fact): between the merge
# RPC and GitHub applying it, a retarget can still land. There is no API
# to prevent that. Detection is the post-merge parent check. Do not
# "fix" this with --admin, a force-push to main, or native --auto merge.
#
# NEVER leave native auto-merge or a merge-queue entry armed after a
# non-merge. `gh pr merge` exit 0 is provisional: when the base requires
# a merge queue it can enqueue / enable auto-merge without merging, and
# GitHub would then land the PR later with Gates 0-3 and the base lock
# bypassed. A zero exit is re-read immediately. If `merged != true`,
# auto-merge is revoked, any merge-queue entry is dequeued, and that is
# a hard ::error:: — enrollment is not a merge. This workflow will not
# enroll; a branch that requires a merge queue is held for aaa-merge.
#
# ── Gate 1 ignores Greptile (2026-09-29) ───────────────────────────────────
# Every check-run published by the `greptile-apps` App is dropped before Gate 1
# counts, so a pending or failing `Greptile Review` neither holds nor passes a
# PR. Every other check must be completed and success/neutral/skipped, and a
# head with no other check at all still holds (fail closed on missing CI).
#
# ── Gate 2: Codex reviewed THIS head (2026-09-29) ──────────────────────────
# Either signal counts, and only for the current head SHA:
#   1. a Codex review object (author chatgpt-codex-connector, a Bot) whose
#      commit_id is the head, not DISMISSED, and not a skip notice. Codex posts
#      one to carry findings; Gate 3 then decides whether they block.
#   2. Codex's clean pass: an issue comment by the Codex Bot, never edited,
#      opening "Codex Review: Didn't find any major issues" and naming exactly
#      one "Reviewed commit" (10-40 hex) that is a prefix of the head and of no
#      other commit this PR carries, or that a head force-push replaced
#      (with its history past the base). The PR's commit list is read in full
#      (a PR over 250 commits, or an unreadable force-push history, gets no
#      comment evidence).
# A review or clean pass of any EARLIER commit never counts. That closes the
# hole the previous gates had (Codex P1 on aaa-runbooks#175): with outdated
# threads excluded, a push could clear the findings and merge a head Codex
# never saw. Now every push needs a fresh Codex review of the new head.
# No other reviewer is evidence: not Greptile, not a human approval.
# Fails closed: unreadable reviews or comments hold.
#
# Both signals must also be newer than the PR's latest retarget or head
# force-push (Codex P1s on .github#57), so evidence for another base, or for
# a head a force-push replaced, never carries over. An unreadable history
# holds the PR.
#
# RESIDUAL, accepted: a clean-pass comment names a head, not a base; if the
# PR is retargeted WHILE Codex reviews, the pass lands after the retarget for
# a diff Codex did not see. Nothing records when a review started. It needs
# write access and a retarget mid-review (the same residual review-verdict
# documents).
#
# ── Gate 3: open P0/P1 Codex findings block ────────────────────────────────
# Gate 2 proves Codex looked; Gate 3 reads what it said. An unresolved review
# thread started by the Codex Bot blocks when its severity is P0 or P1, read
# from the badge Codex puts in the comment body (`![P1 Badge](...)`), and
# when the thread still applies to the code (not outdated; a thread raised on
# the current head always does). An outdated thread no longer applies, and
# Gate 2 already requires Codex to have reviewed the new head. A Codex thread with no readable P2/P3 badge
# counts as P0/P1 (fail closed). P2/P3 threads, and every thread started by
# anyone else (humans, Greptile, other bots), never block. Resolving a P0/P1
# thread is the decision to release it.
#
# RESIDUAL, accepted: a writer can delete a Codex inline comment, and a
# deleted finding has no severity left to read. Deleting another account's
# review comment needs write access and leaves an audit trail.
#
# A bot "review" that says it skipped the review (claude[bot] did exactly that
# through 2026-08-31, on an overage spend limit) never satisfies Gate 2: a body
# matching REVIEW_SKIP_PATTERN is a status notice, not a verdict.
#
# ── The hold label: `no-auto-merge` (2026-09-18) ──────────────────────────
# A PR labelled `no-auto-merge` is never merged by this workflow; a human
# merges it via aaa-merge. This is the ONE way a repo marks a PR as
# human-only. Repos must not add their own branch exclusions to a copy of
# this file: that is a local fork of the standard, and the next rollout
# deletes it (opportunity-builder#143 dropped exactly such an exclusion for
# its monthly dependency-lock PR). A workflow that opens a PR which must
# never auto-merge applies this label instead.
#
# Read twice: at the start of evaluation, and again in the final snapshot
# immediately before `gh pr merge` (see below), so a label added
# mid-evaluation still holds. Fail CLOSED: a PR whose labels cannot be read
# is held.
#
# ── The final snapshot: one read, last, for everything unpinned (2026-09-18)
# Gates 2-3 run minutes before the merge call, and a review arriving in that
# window does not move the head SHA, so the head pin cannot see it. Codex
# found this on opportunity-builder#143: event-specific concurrency groups
# let a pull_request_review run and a workflow_run for the same PR overlap.
# The hold label has the same property, and adding a label triggers no run.
#
# GitHub has no merge-if-unchanged call, so some read always sits between a
# check and the merge, and a check made in a separate read before another
# one leaves a gap for the other. Two review rounds on .github#33 proved
# it: re-reading reviews before PR_LOCK left reviews exposed during that
# fetch; moving them after PR_LOCK left the label exposed during the review
# reads. Reordering only moves the gap.
#
# So every signal that nothing pins is read in ONE GraphQL query, after the
# PR_LOCK re-read and immediately before `gh pr merge`: the head OID, the
# labels, the draft state, the latest 100 reviews, the latest 100 issue
# comments and the first 100 review threads.
#
# Gates 2 and 3 are re-run from that read (.github#43, 2026-09-23): a Codex
# review dismissed, or a clean pass edited or deleted, mid-run holds, and a
# P0/P1 finding filed mid-run holds. GraphQL drops the `[bot]` suffix from a
# Bot's login, so logins are compared with and without it, but only for an
# author whose type is Bot, so a user account named like the app never
# counts. The head is additionally pinned by --match-head-commit, and a base
# move is detected after the merge by verify_squash_parent, so head/base stay
# in the REST PR_LOCK read before it.
#
# Residual (accepted): that one round trip plus the merge RPC. A review or
# label that lands inside it is not seen. That is the smallest window the
# API allows. Two fallbacks widen it, both rare: a PR with more than 100
# reviews or more than 100 threads is re-read with the full paginated
# reads; a PR with more than 100 labels is held. Only the latest 100 issue
# comments are read, which can only lose a clean pass (holds), never add one.
#
# ── Triggers ───────────────────────────────────────────────────────────────
#   workflow_run          — CI finished. Usually BEFORE the review bots submit.
#   pull_request_review   — a review landed; re-evaluate immediately.
#   (pull_request_review_thread is NOT accepted by GitHub Actions; see `on:`)
#   issue_comment         — Codex posted, edited or deleted a PR comment (its
#                           clean pass is an issue comment, which fires
#                           neither of the above). Filtered on the comment's
#                           author in the job `if`.
#   workflow_dispatch     — by hand: `gh workflow run auto-merge.yml`. The
#                           org-level sweep (auto-merge-sweep.yml) was removed
#                           in .github#54 (2026-09-29), so NOTHING retries on a
#                           schedule. A resolved review thread has no trigger
#                           of its own: dispatch by hand after resolving one.
#                           There is deliberately NO per-repo `schedule:`.
#
# Uses workflow_run (not check_suite) because GitHub does not emit check_suite
# events for GITHUB_TOKEN-run CI workflows. workflow_run is always emitted.
#
# ── Governance / rollout ───────────────────────────────────────────────────
# THIS IS THE CANONICAL COPY (Automation-Architecture/.github). Edit shared
# behaviour HERE, never in a per-repo copy. Per-repo copies are synced only
# through rollout PRs that rollout-monitor.yml drains; it never writes to a
# repo's own main, so a repo that hand-edited its copy keeps that edit.
#
# Merge strategy: squash only, and deliberately NOT --admin, so this respects
# whatever the repo's ruleset requires. Admin bypass lives in aaa-merge and
# other operator-explicit flows, never here. Note the corollary: on a repo
# whose ruleset requires no reviews, "respects the ruleset" constrains nothing,
# and Gates 0-3 below are the only thing standing between a PR and main.
#
# Rollout PRs for this file are merged by a person (Gate 0 holds them), with
# a normal `gh pr merge --squash`, never --admin.
#
# There is deliberately NO `--auto` fallback. Queuing native auto-merge hands
# the decision to GitHub, which merges once the blocking requirement clears
# WITHOUT re-running anything here — every gate and the head pin bypassed. The
# previous canonical did this. A later event (CI, a review, a Codex comment)
# or a manual dispatch re-evaluates instead.
#

on:
  workflow_run:
    # Union of the CI workflow names actually in use across the org ("CI" in
    # 12 repos, "PR Autopilot" in 4, as of 2026-09-09). Naming a workflow a
    # repo does not have is harmless - it simply never fires there.
    #
    # A repo whose CI workflow is named neither of these gets no CI-completion
    # trigger; its PRs are evaluated on a review, a Codex comment, or a
    # manual dispatch. The org-level sweep that used to cover this was
    # removed in .github#54 (2026-09-29). Do not add repo-specific names here,
    # and do not add a per-repo `schedule:` (a per-repo cron across ~62 repos
    # cost ~268k runner-minutes a month; .github#28).
    workflows: ["CI", "PR Autopilot"]
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  # NOTE: no `pull_request_review_thread` trigger. GitHub rejects it at parse
  # time ("Unexpected value 'pull_request_review_thread'"), which turns the
  # whole workflow into a failed push-run and disables every other trigger.
  # Resolving a finding therefore releases the merge only when something
  # runs this workflow again: a review, a Codex comment, CI, or
  # `gh workflow run auto-merge.yml` by hand.
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-${{ github.repository }}-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]') ||
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge
        env:
          # Prefer the org PAT. A merge performed with GITHUB_TOKEN does not
          # create workflow runs for the events it causes, so the canonical
          # `pull_request: closed` workflows (sentry-release, dashboard-sync)
          # silently never fire for an auto-merged PR. A PAT-driven merge does
          # fire them. Falls back to GITHUB_TOKEN if the org secret is not
          # visible to this repo; the gates behave identically either way.
          GH_TOKEN: ${{ secrets.AAA_ORG_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          PRR_PR: ${{ github.event.pull_request.number }}
          IC_PR: ${{ github.event.issue.number }}
          # The one reviewer. REST login (GraphQL drops the `[bot]` suffix).
          CODEX_BOT: "chatgpt-codex-connector[bot]"
          # Check-runs from this App are ignored by Gate 1 (Greptile is outside
          # the merge policy). Never Gate 2 evidence, never blocking.
          IGNORED_CHECK_APP: "greptile-apps"
          # Case-insensitive regex. A review whose BODY matches is a status
          # notice, not a verdict, and does not satisfy Gate 2. Reviewers post
          # these during outages, rate limits and spend caps: claude[bot] spent
          # 2026-08-31 posting "Code review skipped - your organization's overage
          # spend limit has been reached" AS A REVIEW. Such a review carries no
          # findings, so Gate 3 would see nothing wrong and the PR would merge
          # having been read by nobody. Holding is the safe direction, so this pattern
          # is deliberately broad.
          REVIEW_SKIP_PATTERN: "review (was )?skipped|skipping (this )?review|could not (complete|finish|review)|unable to review|rate.?limit|quota exceeded|spend limit"
          # A PR carrying this label is held for a human. See the header.
          HOLD_LABEL: "no-auto-merge"
        run: |
          set -euo pipefail

          # Revoke a queued native auto-merge and verify the revocation stuck.
          # `gh pr merge --disable-auto` can fail transiently; swallowing that
          # would leave GitHub free to merge the PR the moment its outstanding
          # requirement clears, bypassing every gate below. So: check, revoke,
          # re-check, and shout if it is still armed.
          revoke_auto_merge() {
            local pr="$1" armed
            armed=$(gh pr view "$pr" --repo "$REPO" --json autoMergeRequest \
                    --jq '.autoMergeRequest != null' 2>/dev/null || echo unknown)
            [ "$armed" = "false" ] && return 0
            gh pr merge "$pr" --disable-auto --repo "$REPO" >/dev/null 2>&1 || true
            armed=$(gh pr view "$pr" --repo "$REPO" --json autoMergeRequest \
                    --jq '.autoMergeRequest != null' 2>/dev/null || echo unknown)
            if [ "$armed" != "false" ]; then
              echo "::error::Could not revoke queued auto-merge on #$pr - it may merge despite these gates."
              return 1
            fi
            echo "::notice::Revoked queued auto-merge on #$pr; this workflow decides when it merges."
            return 0
          }

          # Read isInMergeQueue as the literals true/false only. Empty, null,
          # missing fields, GraphQL errors, and transport failures are all
          # unreadable — callers must not treat them as "not in queue".
          read_is_in_merge_queue() {
            local pr="$1" json
            json=$(gh api graphql \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$pr" \
              -f query='query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){ isInMergeQueue } } }' 2>/dev/null) || json=""
            printf '%s' "$json" | jq -r '
              if (.errors | type == "array") and (.errors | length) > 0 then empty
              elif .data.repository.pullRequest.isInMergeQueue == true then "true"
              elif .data.repository.pullRequest.isInMergeQueue == false then "false"
              else empty end' 2>/dev/null || true
          }

          # Dequeue a merge-queue entry. Mutation input is `id` (the PR node
          # id), NOT `pullRequestId` — this comment said the opposite until
          # 2026-09-20 while the code matched it, and every dequeue failed
          # schema validation. Fail CLOSED: mutation errors are not
          # swallowed, and only an explicit post-read isInMergeQueue==false
          # is success. An unreadable pre-read still attempts dequeue — it
          # must not skip the mutation and leave a queued PR armed.
          dequeue_merge_queue() {
            local pr="$1" node_id in_queue mut_json mut_rc mut_err
            in_queue=$(read_is_in_merge_queue "$pr")
            if [ "$in_queue" = "false" ]; then
              return 0
            fi
            if [ "$in_queue" != "true" ]; then
              echo "::error::Could not read isInMergeQueue for #$pr before dequeue — attempting dequeuePullRequest anyway."
            fi

            node_id=$(gh api "/repos/$REPO/pulls/$pr" --jq '.node_id' 2>/dev/null || true)
            if [ -z "$node_id" ] || [ "$node_id" = "null" ]; then
              echo "::error::Could not read node_id for #$pr — cannot dequeue merge-queue entry."
              return 1
            fi

            mut_rc=0
            # The input field is `id`, NOT `pullRequestId`. Verified against
            # the live schema: DequeuePullRequestInput exposes exactly
            # { clientMutationId, id }. The wrong name fails schema validation
            # every time, which left the queue entry armed while this workflow
            # believed it had disarmed it — GitHub could then merge the PR
            # later without re-running Gates 0-3.
            mut_json=$(gh api graphql -f id="$node_id" \
              -f query='mutation($id:ID!){
                dequeuePullRequest(input:{id:$id}){ clientMutationId } }' \
              2>/dev/null) || mut_rc=$?
            mut_err=$(printf '%s' "$mut_json" | jq -r '.errors[]?.message // empty' 2>/dev/null | tr '\n' ';' | sed 's/;$//')
            if [ "$mut_rc" -ne 0 ] || [ -n "$mut_err" ]; then
              echo "::error::dequeuePullRequest failed for #$pr (rc=$mut_rc${mut_err:+; $mut_err})."
            fi

            in_queue=$(read_is_in_merge_queue "$pr")
            if [ "$in_queue" != "false" ]; then
              echo "::error::Could not dequeue merge-queue entry on #$pr (isInMergeQueue=${in_queue:-unreadable}) - it may merge despite these gates."
              return 1
            fi
            if [ "$mut_rc" -ne 0 ] || [ -n "$mut_err" ]; then
              echo "::error::dequeuePullRequest failed for #$pr after verify — refusing to treat as a clean dequeue."
              return 1
            fi
            return 0
          }

          # Every non-merge exit must leave neither native auto-merge nor a
          # merge-queue entry armed. GitHub would otherwise merge later
          # without re-running Gates 0-3.
          disarm_deferred_merge() {
            local pr="$1" rc=0
            revoke_auto_merge "$pr" || rc=1
            dequeue_merge_queue "$pr" || rc=1
            return "$rc"
          }

          # Hold when the base clearly has a merge queue. Detected via
          # mergeStateStatus=QUEUED, isInMergeQueue, or repository.mergeQueue
          # for this branch. A GraphQL miss is NOT a hold (no false positives);
          # the post-merge re-read still refuses enrollment.
          hold_if_merge_queue() {
            local pr="$1" branch="$2" why="$3" status qid in_queue
            status=$(gh pr view "$pr" --repo "$REPO" --json mergeStateStatus \
                     --jq '.mergeStateStatus' 2>/dev/null || echo "")
            qid=$(gh api graphql \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -f branch="$branch" \
              -f query='query($owner:String!,$name:String!,$branch:String!){
                repository(owner:$owner,name:$name){ mergeQueue(branch:$branch){ id } } }' \
              --jq '.data.repository.mergeQueue.id // empty' 2>/dev/null || echo "")
            in_queue=$(gh api graphql \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$pr" \
              -f query='query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){ isInMergeQueue } } }' \
              --jq '.data.repository.pullRequest.isInMergeQueue' 2>/dev/null || echo "")
            if [ "$status" = "QUEUED" ] || [ "$in_queue" = "true" ] \
               || { [ -n "$qid" ] && [ "$qid" != "null" ]; }; then
              echo "::notice::PR #$pr held — base $branch requires a merge queue ($why; status=${status:-unknown}). This workflow will not enroll; humans use aaa-merge."
              disarm_deferred_merge "$pr" || return 1
              return 1
            fi
            return 0
          }

          # Gate 0: hold a PR whose effective diff edits reviewer/gate config.
          # Reads filename AND previous_filename so a rename cannot dodge it.
          # Fail CLOSED on an unreadable OR incomplete file list (GitHub caps
          # list-PR-files at 3000). $3 is the PR JSON that supplied
          # changed_files — do not re-fetch it here, so the count and the
          # file list stay on one snapshot. Used at evaluation start AND
          # immediately before merge.
          GATE0_RE='(^|/)(CLAUDE\.md|AGENTS\.md|\.cursorrules)$|(^|/)\.claude/|(^|/)\.greptile/|(^|/)\.github/workflows/auto-merge\.yml$'
          GATE0_FILE_CAP=3000
          GATE0_RACE=0
          gate0_hold_if_guarded() {
            local pr="$1" why="$2" pr_json="$3"
            local changed_files files_json n_listed guarded
            if [ -z "${GATE0_RE}" ]; then
              echo "::error::GATE0_RE is empty — refusing to merge."
              return 1
            fi
            if [ -z "$pr_json" ]; then
              echo "::error::Gate 0 ($why) missing PR payload for #$pr — refusing to merge."
              return 1
            fi
            changed_files=$(echo "$pr_json" | jq -r '.changed_files')
            case "$changed_files" in
              ''|*[!0-9]*)
                echo "::error::Could not read changed_files for #$pr ($why) — refusing to merge."
                return 1
                ;;
            esac
            # A truncated page chain still looks like success. Hold at the
            # cap even when listed == 3000: that cannot be distinguished
            # from a truncated larger PR.
            if [ "$changed_files" -ge "$GATE0_FILE_CAP" ]; then
              echo "::error::PR #$pr has $changed_files changed files, at or above the ${GATE0_FILE_CAP}-file list cap ($why) — refusing to merge."
              return 1
            fi
            if ! files_json=$(gh api "/repos/$REPO/pulls/$pr/files" --paginate --jq '.[]' | jq -s '.'); then
              echo "::error::Could not read changed files for #$pr ($why) — refusing to merge."
              return 1
            fi
            if ! echo "$files_json" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "::error::Unreadable changed-file list for #$pr ($why) — refusing to merge."
              return 1
            fi
            n_listed=$(echo "$files_json" | jq 'length')
            case "$n_listed" in
              ''|*[!0-9]*)
                echo "::error::Could not count changed files for #$pr ($why) — refusing to merge."
                return 1
                ;;
            esac
            if [ "$n_listed" -ne "$changed_files" ]; then
              echo "::error::PR #$pr changed-file list incomplete (listed=$n_listed changed_files=$changed_files, $why) — refusing to merge."
              return 1
            fi
            guarded=$(echo "$files_json" | jq -r '.[] | .filename, (.previous_filename // empty)' \
              | grep -Ei "$GATE0_RE" || true)
            if [ -n "$guarded" ]; then
              echo "::notice::PR #$pr held — edits reviewer/gate configuration, needs a human merge:"
              echo "$guarded" | sed 's/^/  - /'
              return 1
            fi
            return 0
          }

          # After a squash merge, the new tip must parent the base SHA we
          # locked. GitHub has no expectedBaseOid; this is the detect-after
          # close for a retarget between lock and merge. Cannot unmerge.
          verify_squash_parent() {
            local pr="$1" locked_base="$2" locked_ref="$3"
            local merged_json merge_sha parent merged
            if ! merged_json=$(gh api "/repos/$REPO/pulls/$pr"); then
              echo "::error::Could not re-read PR #$pr after merge — cannot verify Gate 0 base pin."
              return 1
            fi
            merged=$(echo "$merged_json" | jq -r '.merged')
            merge_sha=$(echo "$merged_json" | jq -r '.merge_commit_sha')
            if [ "$merged" != "true" ] || [ -z "$merge_sha" ] || [ "$merge_sha" = "null" ]; then
              echo "::error::PR #$pr merge reported success but merge commit is missing — cannot verify Gate 0 base pin."
              return 1
            fi
            if ! parent=$(gh api "/repos/$REPO/commits/$merge_sha" --jq '.parents[0].sha'); then
              echo "::error::Could not read squash parent of $merge_sha for #$pr — cannot verify Gate 0 base pin."
              return 1
            fi
            if [ -z "$parent" ] || [ "$parent" = "null" ]; then
              echo "::error::Squash $merge_sha for #$pr has no parent — cannot verify Gate 0 base pin."
              return 1
            fi
            if [ "$parent" != "$locked_base" ]; then
              echo "::error::Gate 0 base-race on #$pr: squash $merge_sha parent $parent is not locked base $locked_base (ref $locked_ref). A retarget or base movement between lock and merge can put guarded config into the landed diff. Manual inspection required; this workflow cannot unmerge."
              return 1
            fi
            printf 'Gate 0 post-merge OK: squash %s parents locked %s (%s).\n' \
              "${merge_sha:0:7}" "${locked_base:0:7}" "$locked_ref"
            return 0
          }

          # Hold a PR carrying $HOLD_LABEL. Reads the labels from a PR JSON the
          # caller already fetched, so the merge-lock call adds no API round
          # trip. Fail CLOSED on an empty label name or unreadable labels.
          hold_if_labelled() {
            local pr="$1" json="$2" stage="$3" held
            if [ -z "${HOLD_LABEL// /}" ]; then
              echo "::error::HOLD_LABEL is empty - refusing to merge #$pr."
              return 1
            fi
            held=$(echo "$json" | jq -r --arg l "$HOLD_LABEL" \
                     'if (.labels | type) == "array"
                      then ([.labels[].name] | index($l) != null)
                      else "unreadable" end' 2>/dev/null || echo unreadable)
            case "$held" in
              false) return 0 ;;
              true)  echo "::notice::PR #$pr held ($stage) - labelled '$HOLD_LABEL'; a human merges it."
                     return 1 ;;
              *)     echo "::error::Could not read labels for #$pr ($stage) - refusing to merge."
                     return 1 ;;
            esac
          }

          # Gate 2: did Codex review head $4? $1 reviews (REST shape: user.login,
          # user.type, commit_id, state, body), $2 issue comments normalised to
          # {login, type, body, edited, created_at}, $3 the PR's commit SHAs as a
          # JSON array, or `null` when they could not all be read (then no
          # clean-pass comment counts), $5 the latest retarget or head
          # force-push (ISO time, or empty): evidence must be strictly newer. Logins are compared with and without `[bot]`
          # (GraphQL drops it) and the author must BE a Bot, so a user account
          # named like the app never counts. Prints `review`, `comment` or
          # `none`; prints nothing on a jq failure, which callers must hold on.
          codex_reviewed_head() {
            local n
            n=$(echo "$1" | jq --arg u "$CODEX_BOT" --arg s "$4" --arg skip "$REVIEW_SKIP_PATTERN" --arg cut "${5:-}" \
              "$AFTER_CUTOFF_JQ"'
              [.[] | select(.user.type == "Bot"
                             and (.user.login == $u or (.user.login + "[bot]") == $u)
                             and .commit_id == $s
                             and ((.submitted_at // "") | after_cutoff)
                             and (.state | IN("DISMISSED", "PENDING") | not)
                             and (((.body // "") | test($skip; "i")) | not))] | length' 2>/dev/null) || return 0
            [[ "$n" =~ ^[0-9]+$ ]] || return 0
            if [ "$n" -gt 0 ]; then echo review; return 0; fi
            n=$(echo "$2" | jq --arg u "$CODEX_BOT" --arg s "$4" --arg skip "$REVIEW_SKIP_PATTERN" \
                   --argjson commits "$3" --arg cut "${5:-}" "$AFTER_CUTOFF_JQ"'
              def reviewed: [scan("\\*\\*Reviewed commit:\\*\\* `([0-9a-f]{10,40})`") | .[0]];
              [.[] | select(.type == "Bot"
                            and (.login == $u or (.login + "[bot]") == $u)
                            and (.edited == false)
                            and ((.created_at // "") | after_cutoff)
                            and ((.body // "") | test("\\ACodex Review: Didn.t find any major issues"))
                            and (((.body // "") | test($skip; "i")) | not)
                            and ((.body // "") | reviewed | length == 1)
                            and ((.body // "") | reviewed | .[0] as $p
                                 | ($s | startswith($p))
                                   and ($commits | type == "array")
                                   and ([$commits[] | select(. != $s and startswith($p))] | length == 0)))]
              | length' 2>/dev/null) || return 0
            [[ "$n" =~ ^[0-9]+$ ]] || return 0
            if [ "$n" -gt 0 ]; then echo comment; else echo none; fi
          }

          # jq helper: is this ISO time strictly after $cut (empty = no cutoff)?
          # An unparseable time is never after it.
          AFTER_CUTOFF_JQ='
            def parse_time: sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601;
            def after_cutoff: . as $t
              | if $cut == "" then ($t | type == "string" and length > 0)
                else ((try ($t | parse_time) catch null) as $x
                      | (try ($cut | parse_time) catch null) as $c
                      | $x != null and $c != null and $x > $c) end;'

          # PR $1's retarget and head force-push history. Sets CUTOFF (the
          # latest such event, ISO time, or empty) and REPLACED (every commit a
          # head force-push replaced, plus each one's history past base $2, as
          # a JSON array). Codex evidence posted before CUTOFF may cover a
          # different base or a replaced head, so it does not count (Codex P1s
          # on .github#57); a late clean pass for a replaced head A must not
          # count for a colliding current head B. Returns 1 when any part is
          # unreadable or incomplete; the caller holds. Reads the last 100
          # events; more refuses. Same rules as review-verdict.
          load_history() {
            local pr="$1" base="$2" timeline replaced oid history
            CUTOFF=""
            REPLACED="[]"
            if ! timeline=$(gh api graphql \
                  -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$pr" \
                  -f query='query($owner:String!,$name:String!,$number:Int!){
                    repository(owner:$owner,name:$name){ pullRequest(number:$number){
                      timelineItems(last:100, itemTypes:[BASE_REF_CHANGED_EVENT, HEAD_REF_FORCE_PUSHED_EVENT]){
                        pageInfo{ hasPreviousPage }
                        nodes{ __typename
                          ... on BaseRefChangedEvent { createdAt }
                          ... on HeadRefForcePushedEvent { createdAt beforeCommit{ oid } } } } } } }' 2>/dev/null); then
              return 1
            fi
            # -r, not -e: no event at all is a valid, empty answer; error()
            # still exits non-zero.
            if ! CUTOFF=$(echo "$timeline" | jq -r '
                .data.repository.pullRequest.timelineItems
                | if .pageInfo.hasPreviousPage != false then error("more than 100 events") else .nodes end
                | if type != "array" then error("no timeline") else . end
                | map(.createdAt // error("event without createdAt")) | max // ""' 2>/dev/null) \
               || ! replaced=$(echo "$timeline" | jq -r '
                [.data.repository.pullRequest.timelineItems.nodes[]
                  | select(.__typename == "HeadRefForcePushedEvent")
                  | (.beforeCommit.oid // error("force-push without a before commit"))] | unique | .[]' 2>/dev/null); then
              CUTOFF=""
              return 1
            fi
            for oid in $replaced; do
              # Paged: one response lists at most 250 commits; every page
              # repeats total_commits.
              if ! history=$(gh api --paginate "/repos/$REPO/compare/$base...$oid?per_page=100" 2>/dev/null \
                  | jq -es --arg oid "$oid" '([.[].commits[].sha] | unique) as $s
                      | if ($s | length) == .[0].total_commits then [$oid] + $s else error("incomplete") end' 2>/dev/null); then
                return 1
              fi
              REPLACED=$(jq -n --argjson a "$REPLACED" --argjson b "$history" '$a + $b | unique')
            done
            return 0
          }

          # Gate 3's rule, one jq filter used by both reads (evaluation and the
          # final snapshot). Input: review-thread nodes with comments(first:1)
          # {author{__typename login} path body}. Output:
          # the threads that block. See the header.
          BLOCKING_THREADS_JQ='
            def sev: ((.comments.nodes[0].body // "") | [scan("!\\[P([0-3]) Badge\\]") | .[0]] | first) // "?";
            [.[] | (.comments.nodes[0] // {}) as $c
                 | select(.isResolved == false
                          and ($c.author.__typename // "") == "Bot"
                          and (($c.author.login // "") == $u or (($c.author.login // "") + "[bot]") == $u)
                          and (sev | IN("2", "3") | not)
                          and .isOutdated == false)]'

          # Collect every BLOCKING review thread (Gate 3's rule, above) into
          # OPEN_THREADS. $2 is the head SHA. Returns 1 (after an ::error::) when the answer cannot
          # be read; the caller must hold. Threads are paged 100 at a time and
          # NEVER leave the list - a resolved thread stays in it - so a PR that
          # ever crosses 100 threads is walked page by page. Refusing on
          # hasNextPage would make such a PR unmergeable forever.
          read_open_threads() {
            local pr="$1" sha="$2" after="" page=0 page_json
            local -a after_arg
            OPEN_THREADS="[]"
            while :; do
              page=$((page + 1))
              if [ "$page" -gt 50 ]; then
                echo "::error::PR #$pr has over 5000 review threads (50 pages) — refusing to merge."
                return 1
              fi
              if [ -n "$after" ]; then after_arg=(-f after="$after"); else after_arg=(-F after=null); fi
              page_json=$(gh api graphql \
                -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$pr" "${after_arg[@]}" \
                -f query='query($owner:String!,$name:String!,$number:Int!,$after:String){
                  repository(owner:$owner,name:$name){
                    pullRequest(number:$number){
                      reviewThreads(first:100, after:$after){
                        pageInfo{ hasNextPage endCursor }
                        nodes{ isResolved isOutdated
                          comments(first:1){ nodes{ author{ __typename login } path body } } } } } } }' \
                --jq '.data.repository.pullRequest.reviewThreads
                      | {more: .pageInfo.hasNextPage, cursor: .pageInfo.endCursor, nodes: .nodes}' 2>/dev/null) || page_json=""

              # Fail CLOSED on every page: an unreadable answer is not an
              # empty one, and `.more` must be a real boolean — a missing
              # field must read as "cannot tell", never as "no more pages".
              if [ -z "$page_json" ] \
                 || ! echo "$page_json" | jq -e '(.nodes | type == "array") and (.more | type == "boolean")' >/dev/null 2>&1; then
                echo "::error::Could not read review threads (page $page) for #$pr — refusing to merge."
                return 1
              fi
              local blocking
              if ! blocking=$(echo "$page_json" | jq --arg u "$CODEX_BOT" --arg sha "$sha" ".nodes | $BLOCKING_THREADS_JQ"); then
                echo "::error::Could not evaluate review threads (page $page) for #$pr — refusing to merge."
                return 1
              fi
              OPEN_THREADS=$(jq -n --argjson a "$OPEN_THREADS" --argjson b "$blocking" '$a + $b')
              [ "$(echo "$page_json" | jq -r '.more')" = "true" ] || return 0
              after=$(echo "$page_json" | jq -r '.cursor // empty')
              if [ -z "$after" ]; then
                echo "::error::Review threads for #$pr report another page but no cursor — refusing to merge."
                return 1
              fi
            done
          }

          # The final snapshot (see the header): head OID, labels, reviews,
          # issue comments and threads in ONE GraphQL read, immediately before
          # the merge. Re-runs Gates 2 and 3. $3 is the PR's commit SHAs (JSON,
          # or null), read during evaluation; the head is re-pinned here, so
          # the same head has the same commits. Returns 0 only when the PR may
          # merge; every other path holds (return 1), including any
          # unreadable or malformed answer.
          final_snapshot_hold() {
            local pr="$1" sha="$2" commits="$3" cutoff="$4" snap head held n_labels n_reviews more_threads reviews comments via
            if [ -z "${HOLD_LABEL// /}" ]; then
              echo "::error::HOLD_LABEL is empty - refusing to merge #$pr."
              return 1
            fi
            snap=$(gh api graphql \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$pr" \
              -f query='query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    headRefOid
                    isDraft
                    labels(first:100){ totalCount nodes{ name } }
                    reviews(last:100){ totalCount nodes{ state submittedAt body commit{ oid } author{ __typename login } } }
                    comments(last:100){ nodes{ body createdAt lastEditedAt author{ __typename login } } }
                    reviewThreads(first:100){ pageInfo{ hasNextPage }
                      nodes{ isResolved isOutdated
                        comments(first:1){ nodes{ author{ __typename login } path body } } } } } } }' \
              2>/dev/null) || snap=""
            if [ -z "$snap" ] || ! echo "$snap" | jq -e '
                 ((.errors // []) | length) == 0
                 and (.data.repository.pullRequest as $p
                   | ($p.headRefOid | type == "string")
                     and ($p.isDraft | type == "boolean")
                     and ($p.labels.totalCount | type == "number")
                     and ($p.labels.nodes | type == "array")
                     and ($p.reviews.totalCount | type == "number")
                     and ($p.reviews.nodes | type == "array")
                     and ($p.comments.nodes | type == "array")
                     and ($p.reviewThreads.pageInfo.hasNextPage | type == "boolean")
                     and ($p.reviewThreads.nodes | type == "array"))' >/dev/null 2>&1; then
              echo "::error::Could not read the final snapshot for #$pr — refusing to merge."
              return 1
            fi
            head=$(echo "$snap" | jq -r '.data.repository.pullRequest.headRefOid')
            if [ "$head" != "$sha" ]; then
              echo "::notice::PR #$pr head moved before merge (${head:0:7}) — holding."
              return 1
            fi
            # Draft is a person's stop, like the label. Converting to draft
            # fires no event this workflow runs on, so re-read it here: a PR
            # drafted mid-run holds (Codex P1 on .github#59).
            if [ "$(echo "$snap" | jq -r '.data.repository.pullRequest.isDraft')" != "false" ]; then
              echo "::notice::PR #$pr held (final snapshot) - it is a draft."
              return 1
            fi

            n_labels=$(echo "$snap" | jq '.data.repository.pullRequest.labels.totalCount')
            if [ "$n_labels" -gt 100 ]; then
              echo "::error::PR #$pr has $n_labels labels; cannot read them all in one snapshot — refusing to merge."
              return 1
            fi
            held=$(echo "$snap" | jq -r --arg l "$HOLD_LABEL" \
                     '[.data.repository.pullRequest.labels.nodes[].name] | index($l) != null')
            if [ "$held" != "false" ]; then
              echo "::notice::PR #$pr held (final snapshot) - labelled '$HOLD_LABEL'; a human merges it."
              return 1
            fi

            n_reviews=$(echo "$snap" | jq '.data.repository.pullRequest.reviews.totalCount')
            if [ "$n_reviews" -le 100 ]; then
              reviews=$(echo "$snap" | jq '[.data.repository.pullRequest.reviews.nodes[]
                         | {state, submitted_at: .submittedAt, body: (.body // ""),
                            commit_id: (.commit.oid // ""),
                            user: {login: (.author.login // "ghost"), type: (.author.__typename // "")}}]')
            else
              echo "::notice::PR #$pr has $n_reviews reviews; re-reading them all (wider window, see header)."
              if ! reviews=$(gh api "/repos/$REPO/pulls/$pr/reviews" --paginate --jq '.[]' | jq -s '.'); then
                echo "::error::Could not re-read reviews for #$pr before merge — refusing to merge."
                return 1
              fi
            fi
            # Gate 2, re-run: Codex's review or clean pass on this head must
            # still qualify now (dismissed, edited or deleted mid-run holds).
            comments=$(echo "$snap" | jq '[.data.repository.pullRequest.comments.nodes[]
                         | {login: (.author.login // "ghost"), type: (.author.__typename // ""),
                            body: (.body // ""), edited: (.lastEditedAt != null), created_at: (.createdAt // "")}]')
            via=$(codex_reviewed_head "$reviews" "$comments" "$commits" "$sha" "$cutoff")
            case "$via" in
              review|comment) ;;
              none) echo "::notice::PR #$pr held (final snapshot) - Codex's review of this head no longer qualifies."
                    return 1 ;;
              *)    echo "::error::Could not re-check Codex's review of head for #$pr before merge — refusing to merge."
                    return 1 ;;
            esac

            more_threads=$(echo "$snap" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')
            if [ "$more_threads" = "true" ]; then
              echo "::notice::PR #$pr has over 100 review threads; re-reading them all (wider window, see header)."
              read_open_threads "$pr" "$sha" || return 1
            else
              if ! OPEN_THREADS=$(echo "$snap" | jq --arg u "$CODEX_BOT" --arg sha "$sha" \
                     ".data.repository.pullRequest.reviewThreads.nodes | $BLOCKING_THREADS_JQ"); then
                echo "::error::Could not evaluate review threads for #$pr before merge — refusing to merge."
                return 1
              fi
            fi
            if [ "$(echo "$OPEN_THREADS" | jq 'length')" -gt 0 ]; then
              echo "::warning::PR #$pr NOT merged — P0/P1 Codex finding(s) opened since Gate 3."
              return 1
            fi
            return 0
          }

          case "$EVENT" in
            pull_request_review|pull_request_review_thread) PR_LIST="$PRR_PR" ;;
            workflow_run)        PR_LIST="$WR_PR" ;;
            issue_comment)       PR_LIST="${IC_PR:-}" ;;
            # --limit is REQUIRED: `gh pr list` defaults to 30, so without it a
            # repo with more open PRs silently drops the older ones from the
            # sweep - they would never be re-evaluated, and never have a stale
            # queued auto-merge revoked.
            *)                   PR_LIST=$(gh pr list --repo "$REPO" --state open --limit 1000 \
                                   --json number --jq '.[].number' | tr '\n' ' ') ;;
          esac

          if [ -z "${PR_LIST// /}" ]; then
            echo "No PRs to evaluate for $EVENT."
            exit 0
          fi
          echo "Evaluating PR(s): $PR_LIST  (via $EVENT)"

          for PR_NUMBER in $PR_LIST; do
            echo "──────────── PR #$PR_NUMBER ────────────"

            PR=$(gh api "/repos/$REPO/pulls/$PR_NUMBER")
            SHA=$(echo "$PR"    | jq -r '.head.sha')
            BASE=$(echo "$PR"   | jq -r '.base.sha')
            BASE_REF=$(echo "$PR" | jq -r '.base.ref')
            STATE=$(echo "$PR"  | jq -r '.state')
            DRAFT=$(echo "$PR"  | jq -r '.draft')
            N_COMMITS=$(echo "$PR" | jq -r '.commits')

            if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
              echo "::error::Could not resolve HEAD SHA for #$PR_NUMBER — skipping."
              continue
            fi
            if [ -z "$BASE" ] || [ "$BASE" = "null" ] \
               || [ -z "$BASE_REF" ] || [ "$BASE_REF" = "null" ]; then
              echo "::error::Could not resolve base SHA/ref for #$PR_NUMBER — refusing to merge."
              continue
            fi
            [ "$STATE" != "open" ] && { echo "state=$STATE — skip."; continue; }
            [ "$DRAFT" = "true" ]  && { echo "draft — skip."; continue; }

            # Before ANY gate. Every exit below - checks pending, checks failed,
            # missing review, unresolved findings, unreadable gate - must not
            # leave a queued native merge or merge-queue entry armed behind it.
            disarm_deferred_merge "$PR_NUMBER" || continue
            hold_if_merge_queue "$PR_NUMBER" "$BASE_REF" "initial" || continue
            hold_if_labelled "$PR_NUMBER" "$PR" "initial" || continue

            # ── Gate 0: never auto-merge a PR that edits the reviewer ────────
            # These files are instructions to the reviewer, or to this gate.
            # A PR that changes them can suppress the review judging it: an
            # added "scope restrictions" section in CLAUDE.md/AGENTS.md is a
            # demonstrated way to silence a finding, and the reviewers import
            # those files as review context. A PR editing auto-merge.yml is the same
            # problem one level up. Humans merge these, deliberately.
            # Fail CLOSED if the file list is unreadable: `|| true` on the whole
            # pipeline would mask a gh/API failure as "no guarded files" and let
            # exactly the PR this gate exists for through. Suppress only grep's
            # no-match status, and read `previous_filename` too — a rename away
            # from a guarded path (AGENTS.md -> docs/notes.md) otherwise shows
            # only its unguarded destination.
            gate0_hold_if_guarded "$PR_NUMBER" "initial" "$PR" || continue

            # ── Gate 1: check-runs on the current head ──────────────────────
            # Greptile's check-runs are dropped first: Greptile is outside the
            # merge policy, so its check neither holds nor passes a PR.
            if [ -z "${IGNORED_CHECK_APP// /}" ] || [ -z "${CODEX_BOT// /}" ] \
               || [ -z "${REVIEW_SKIP_PATTERN// /}" ]; then
              echo "::error::IGNORED_CHECK_APP, CODEX_BOT or REVIEW_SKIP_PATTERN is empty - refusing to merge."
              continue
            fi
            if ! CHECKS=$(gh api "/repos/$REPO/commits/$SHA/check-runs" --paginate --jq '.check_runs[]' | jq -s '.'); then
              echo "::error::Could not read check-runs for #$PR_NUMBER — refusing to merge."
              continue
            fi
            CHECKS=$(echo "$CHECKS" | jq --arg g "$IGNORED_CHECK_APP" '[.[] | select((.app.slug // "") != $g)]')
            TOTAL=$(echo "$CHECKS"   | jq 'length')
            PENDING=$(echo "$CHECKS" | jq '[.[] | select(.status != "completed")] | length')
            # ACCEPT-LIST, not a deny-list. Listing the failure conclusions let
            # everything else through, so `startup_failure` (the job never ran:
            # bad YAML, an unresolvable action) and `stale` (GitHub abandoned
            # the run) both counted as green. A check that never executed is not
            # a passed check. Found on aaa-clients#28. `neutral` and `skipped`
            # DO pass: that is how a conditional job and an advisory check say
            # "nothing to do here". Anything else, including a conclusion GitHub
            # adds later, holds.
            BLOCKED=$(echo "$CHECKS"  | jq '[.[] | select(
              (.conclusion // "") | IN("success", "neutral", "skipped") | not
            )] | length')

            [ "$TOTAL" -eq 0 ]   && { echo "no check-runs (other than ${IGNORED_CHECK_APP}'s) — skip."; continue; }
            [ "$PENDING" -gt 0 ] && { echo "$PENDING check(s) pending — skip."; continue; }
            if [ "$BLOCKED" -gt 0 ]; then
              echo "$CHECKS" | jq -r '.[] | select((.conclusion // "") | IN("success", "neutral", "skipped") | not) | "  - \(.name): \(.conclusion // "no conclusion")"'
              echo "$BLOCKED check(s) not passing — skip."
              continue
            fi
            echo "Gate 1 OK: $TOTAL check-run(s) accepted (success/neutral/skipped; ${IGNORED_CHECK_APP} ignored)."

            # ── Gate 2: Codex reviewed THIS head (hard hold) ─────────────────
            if ! REVIEWS=$(gh api "/repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --jq '.[]' | jq -s '.'); then
              echo "::error::PR #$PR_NUMBER held - could not read reviews."
              continue
            fi

            # No review decision holds a PR: a CHANGES_REQUESTED from a person,
            # Greptile or any other bot is not read (Brad, 2026-09-29: "we do
            # not need humans whatsoever"). Only Codex P0/P1 findings and CI
            # decide; a person who wants a PR stopped uses the draft state or
            # the no-auto-merge label.

            # Issue comments, for Codex's clean pass. GraphQL gives lastEditedAt
            # (REST has no edit marker). The latest 100 only: a miss can only
            # lose a clean pass, which holds.
            if ! COMMENTS=$(gh api graphql \
                  -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$PR_NUMBER" \
                  -f query='query($owner:String!,$name:String!,$number:Int!){
                    repository(owner:$owner,name:$name){ pullRequest(number:$number){
                      comments(last:100){ nodes{ body createdAt lastEditedAt author{ __typename login } } } } } }' \
                  --jq '[.data.repository.pullRequest.comments.nodes[]
                         | {login: (.author.login // "ghost"), type: (.author.__typename // ""),
                            body: (.body // ""), edited: (.lastEditedAt != null), created_at: (.createdAt // "")}]' 2>/dev/null) \
               || ! echo "$COMMENTS" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "::error::PR #$PR_NUMBER held - could not read comments."
              continue
            fi

            # Every commit this PR carries, so a Reviewed-commit prefix is shown
            # to name only this head. The endpoint stops at 250; beyond that,
            # or if unreadable, no clean-pass comment counts (`null`).
            # Retarget / force-push history: sets CUTOFF and REPLACED. Evidence
            # older than CUTOFF may cover another base or a replaced head.
            if ! load_history "$PR_NUMBER" "$BASE"; then
              echo "::error::PR #$PR_NUMBER held - could not read its retarget and force-push history."
              continue
            fi
            COMMITS=null
            if [[ "$N_COMMITS" =~ ^[0-9]+$ ]] && [ "$N_COMMITS" -le 250 ]; then
              if C=$(gh api "/repos/$REPO/pulls/$PR_NUMBER/commits" --paginate --jq '.[].sha' | jq -Rs 'split("\n") | map(select(length > 0))') \
                 && [ "$(echo "$C" | jq 'length')" = "$N_COMMITS" ]; then
                COMMITS=$(jq -n --argjson a "$C" --argjson b "$REPLACED" '$a + $b | unique')
              fi
            fi

            GATE2_VIA=$(codex_reviewed_head "$REVIEWS" "$COMMENTS" "$COMMITS" "$SHA" "$CUTOFF")
            case "$GATE2_VIA" in
              review|comment) ;;
              none)
                printf '::notice::PR #%s held - Codex has not reviewed %s (a review or clean pass of an earlier commit does not count).\n' \
                  "$PR_NUMBER" "${SHA:0:7}"
                continue ;;
              *)
                echo "::error::PR #$PR_NUMBER held - could not evaluate Codex's review of the head."
                continue ;;
            esac
            printf 'Gate 2 OK: Codex reviewed %s (%s).\n' "${SHA:0:7}" "$GATE2_VIA"

            # ── Gate 3: open P0/P1 Codex findings ───────────────────────────
            # read_open_threads pages the list, applies Gate 3's rule and
            # fails closed; see the helper and the header.
            read_open_threads "$PR_NUMBER" "$SHA" || continue
            THREADS="$OPEN_THREADS"

            UNRESOLVED=$(echo "$THREADS" | jq 'length')
            if [ "$UNRESOLVED" -gt 0 ]; then
              echo "$THREADS" | jq -r '.[] | "  - \(.comments.nodes[0].path // "?") (\(.comments.nodes[0].author.login // "?"))"'
              echo "::warning::PR #$PR_NUMBER NOT merged — $UNRESOLVED open P0/P1 Codex finding(s). Fix them, or resolve the thread(s) to release the merge."
              continue
            fi
            echo "Gate 3 OK: no open P0/P1 Codex findings."

            # Merge-time Gate 0. Order is load-bearing: files check first,
            # then the last head+base re-read, then the final snapshot, then
            # merge. GitHub has no expectedBaseOid; --match-head-commit
            # only pins the head. A retarget after the lock is detected by
            # verify_squash_parent (squash parent must be $BASE).
            if ! PR_PRE=$(gh api "/repos/$REPO/pulls/$PR_NUMBER"); then
              echo "::error::Could not re-read PR #$PR_NUMBER before merge — refusing to merge."
              continue
            fi
            SHA_NOW=$(echo "$PR_PRE"  | jq -r '.head.sha')
            BASE_NOW=$(echo "$PR_PRE" | jq -r '.base.sha')
            BASE_REF_NOW=$(echo "$PR_PRE" | jq -r '.base.ref')
            if [ -z "$SHA_NOW" ] || [ "$SHA_NOW" = "null" ] \
               || [ -z "$BASE_NOW" ] || [ "$BASE_NOW" = "null" ] \
               || [ -z "$BASE_REF_NOW" ] || [ "$BASE_REF_NOW" = "null" ]; then
              echo "::error::Could not resolve head/base for #$PR_NUMBER before merge — refusing to merge."
              continue
            fi
            if [ "$SHA_NOW" != "$SHA" ]; then
              echo "::notice::PR #$PR_NUMBER head moved since evaluation — leaving it for the next run."
              continue
            fi
            if [ "$BASE_NOW" != "$BASE" ] || [ "$BASE_REF_NOW" != "$BASE_REF" ]; then
              echo "::notice::PR #$PR_NUMBER base moved since Gate 0 ($BASE_REF@$BASE -> $BASE_REF_NOW@$BASE_NOW) — holding; the next run re-evaluates against the new base."
              continue
            fi
            hold_if_merge_queue "$PR_NUMBER" "$BASE_REF" "pre-merge" || continue
            gate0_hold_if_guarded "$PR_NUMBER" "pre-merge" "$PR_PRE" || continue

            # Last head+base re-read. After it: local jq, then the final
            # snapshot (one GraphQL read), then merge. See the header.
            if ! PR_LOCK=$(gh api "/repos/$REPO/pulls/$PR_NUMBER"); then
              echo "::error::Could not re-read PR #$PR_NUMBER before merge — refusing to merge."
              continue
            fi
            if [ "$(echo "$PR_LOCK" | jq -r '.head.sha')" != "$SHA" ] \
               || [ "$(echo "$PR_LOCK" | jq -r '.base.sha')" != "$BASE" ] \
               || [ "$(echo "$PR_LOCK" | jq -r '.base.ref')" != "$BASE_REF" ]; then
              echo "::notice::PR #$PR_NUMBER head/base changed during Gate 0 revalidation — holding."
              continue
            fi
            PRE_N=$(echo "$PR_PRE"  | jq -r '.changed_files')
            LOCK_N=$(echo "$PR_LOCK" | jq -r '.changed_files')
            if [ "$PRE_N" != "$LOCK_N" ]; then
              echo "::notice::PR #$PR_NUMBER changed_files moved during Gate 0 ($PRE_N -> $LOCK_N) — holding."
              continue
            fi
            # Last: one read of everything unpinned (head OID, labels, reviews,
            # threads). See the header. Nothing but local jq between it and the
            # merge call.
            final_snapshot_hold "$PR_NUMBER" "$SHA" "$COMMITS" "$CUTOFF" || continue
            echo "Merging PR #$PR_NUMBER (Gate 0 and final snapshot revalidated)..."

            # gh pr merge exit 0 is provisional: a merge-queue base enqueues
            # or enables auto-merge without merging. Re-read immediately.
            # Enrollment is not a merge; disarm and fail closed.
            merge_rc=0
            gh pr merge "$PR_NUMBER" --squash --match-head-commit "$SHA" --delete-branch --repo "$REPO" || merge_rc=$?
            if ! POST=$(gh api "/repos/$REPO/pulls/$PR_NUMBER"); then
              echo "::error::Could not re-read PR #$PR_NUMBER after merge command — refusing to treat as merged."
              disarm_deferred_merge "$PR_NUMBER" || true
              GATE0_RACE=1
              continue
            fi
            POST_MERGED=$(echo "$POST" | jq -r '.merged')
            POST_SHA=$(echo "$POST" | jq -r '.merge_commit_sha')
            if [ "$POST_MERGED" = "true" ] && [ -n "$POST_SHA" ] && [ "$POST_SHA" != "null" ]; then
              if ! verify_squash_parent "$PR_NUMBER" "$BASE" "$BASE_REF"; then
                GATE0_RACE=1
              fi
              continue
            fi
            POST_ARMED=$(echo "$POST" | jq '(.auto_merge != null)' 2>/dev/null || echo unknown)
            POST_STATUS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus \
                          --jq '.mergeStateStatus' 2>/dev/null || echo "")
            POST_QUEUE=$(gh api graphql \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$PR_NUMBER" \
              -f query='query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){ isInMergeQueue } } }' \
              --jq '.data.repository.pullRequest.isInMergeQueue' 2>/dev/null || echo "")
            if [ "$merge_rc" -eq 0 ] || [ "$POST_ARMED" = "true" ] \
               || [ "$POST_QUEUE" = "true" ] || [ "$POST_STATUS" = "QUEUED" ]; then
              echo "::error::PR #$PR_NUMBER: gh pr merge exited $merge_rc but merged=$POST_MERGED — enrollment (auto-merge / merge queue) is not a merge. GitHub would land this later without Gates 0-3. Disarming; humans use aaa-merge."
              disarm_deferred_merge "$PR_NUMBER" || true
              GATE0_RACE=1
              continue
            fi
            disarm_deferred_merge "$PR_NUMBER" || continue
            # Deliberately NO `--auto` fallback. Queuing native auto-merge hands
            # the decision to GitHub, which merges once the blocking requirement
            # clears WITHOUT re-running anything here - Gates 0-3 and the head
            # pin are all bypassed. A later dispatch re-evaluates every gate
            # against the head as it is at that moment: the next CI, review or
            # Codex-comment event, or a manual run. A blocked PR waits; it does
            # not slip through — but if nothing dispatches, it waits forever,
            # so the notice below is not a promise that anything will retry.
            echo "::notice::PR #$PR_NUMBER not mergeable yet - leaving it for the next run."
          done

          if [ "$GATE0_RACE" -ne 0 ]; then
            echo "::error::One or more merges failed Gate 0 post-checks (base-race or merge-queue/auto-merge enrollment without a merge)."
            exit 1
          fi
