name: Auto-Merge when Checks Green

# Squash-merges a PR once ALL check-runs on the HEAD SHA have completed with
# none failed.
#
# ⚠️ THIS IS NOT A REVIEW GATE. It gates on check-runs only.
#
# The header used to claim "CodeRabbit is the sole required reviewer ... it can
# never merge before the required CodeRabbit check is green." That was false in
# two ways and was removed 2026-08-30:
#   - CodeRabbit was retired org-wide on 2026-06-11. Its last review anywhere in
#     the org was that day. Nothing has replaced it as a *required* check.
#   - A review is not a check-run, so this workflow cannot see one and cannot
#     wait for one. A MISSING reviewer is not a failure, so the condition the
#     old comment called impossible is reachable: it can merge a PR nobody has
#     reviewed.
#
# Reviewer, for the avoidance of doubt:
#   **Codex is the org's PR reviewer** (`chatgpt-codex-connector[bot]`), and is
#   the one to prefer and to ask for by name. But it is ADVISORY here — it
#   produces no check-run, so it neither blocks nor delays this workflow. Two
#   things about it are load-bearing when reasoning about what got reviewed:
#     - It reviews on PR **open** / ready-for-review / an `@codex review`
#       comment — NOT on push. Commits pushed after the first review are
#       unreviewed unless you ask again.
#     - It is enabled **per repo** in the ChatGPT Codex settings, not by the
#       GitHub App's org-wide install. Many org repos have it on; many do not.
#   See aaa-runbooks `integrations/codex-pr-code-review.md`.
#
# If you want merges genuinely gated on review, that belongs in branch
# protection ("require approvals" / a required check), not in this file. This
# workflow deliberately does NOT use --admin, so it does respect whatever the
# ruleset requires — but on a repo whose ruleset requires no reviews, that
# constrains nothing.
#
# Triggers:
#   check_suite:completed         — a suite of checks finished
#   pull_request_review:submitted — a review was submitted
#
# ⚠️ KNOWN LIMITATION — on many repos this workflow effectively never merges.
#   GitHub does not deliver `check_suite:completed` to workflows for suites
#   created by GITHUB_TOKEN, which is how most of our CI runs. So on those repos
#   the only live trigger is `pull_request_review:submitted` — which fires when
#   a bot posts a review, typically while CI is still pending. It logs
#   "still pending — not merging yet", and nothing wakes it again once CI goes
#   green. Measured on Automation-Architecture/opportunity-builder 2026-08-30:
#   all 20 runs were `pull_request_review`, none were `check_suite`, and the
#   workflow has never merged a PR there.
#
#   ~23 org repos already run a `workflow_run:` variant of this file that fixes
#   exactly this. That variant is NOT canonical, so those repos have drifted
#   ahead of this file. Reconciling the two (and deciding whether auto-merge
#   SHOULD start working on the other ~46) is a deliberate behaviour change and
#   is tracked separately — do not "fix" it by editing a per-repo copy.
#
# Merge strategy:
#   1. gh pr merge --squash --delete-branch (normal merge, respects ruleset)
#   2. gh pr merge --auto  --squash --delete-branch (queue native auto-merge if still BLOCKED)
#   Deliberately NOT --admin. Admin bypass lives in aaa-merge / operator-explicit flows only.
#
# Rollout: canonical copy lives in Automation-Architecture/.github. Edit it
# there only; per-repo edits are overwritten by rollout-monitor.

on:
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read

# One merge attempt per SHA at a time. Concurrent triggers for the same SHA
# queue; once the first merges the PR, the rest find no open PR and exit clean.
concurrency:
  group: auto-merge-${{ github.repository }}-${{ github.event.check_suite.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # Skip check_suite events that are not associated with any PR (e.g. direct
    # pushes to the default branch) — avoids unnecessary API work.
    if: |
      github.event_name == 'pull_request_review' ||
      github.event.check_suite.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ── Resolve SHA and PR number ────────────────────────────────────
          if [ "${{ github.event_name }}" = "check_suite" ]; then
            SHA="${{ github.event.check_suite.head_sha }}"
            # Use the payload's pull_requests array: it contains only same-repo PRs
            # (GitHub excludes fork PRs from check_suite.pull_requests), so no fork
            # guard is needed here and no extra API call is required.
            PR_NUMBER="${{ github.event.check_suite.pull_requests[0].number }}"
          else
            # pull_request_review: skip PRs from forks — GITHUB_TOKEN is read-only there.
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "$REPO" ]; then
              echo "Fork PR — skipping."
              exit 0
            fi
            SHA="${{ github.event.pull_request.head.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for SHA $SHA — nothing to merge."
            exit 0
          fi
          echo "PR #$PR_NUMBER  HEAD $SHA"

          # ── Gate: at least one check-run, all completed, none failed ──────
          # Paginate: repos with many workflows can exceed 100 check-runs per SHA.
          # --jq emits a bare stream of objects; jq -s slurps into a single array.
          CHECK_RUNS=$(gh api "/repos/$REPO/commits/$SHA/check-runs" --paginate \
            --jq '.check_runs[]' | jq -s '.')

          TOTAL=$(echo "$CHECK_RUNS"   | jq 'length')
          PENDING=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status != "completed")] | length')
          FAILED=$(echo "$CHECK_RUNS"  | jq '[.[] | select(
            .conclusion == "failure" or
            .conclusion == "timed_out" or
            .conclusion == "cancelled" or
            .conclusion == "action_required"
          )] | length')

          if [ "$TOTAL" -eq 0 ]; then
            echo "No check-runs found for $SHA — not merging (no CI evidence)."
            exit 0
          fi
          if [ "$PENDING" -gt 0 ]; then
            echo "$PENDING check(s) still pending — not merging yet."
            exit 0
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED check(s) failed — not merging."
            exit 0
          fi

          # ── All checks green — attempt merge ──────────────────────────────
          echo "All checks green. Merging PR #$PR_NUMBER..."

          # Try normal merge first; fall back to --auto if the ruleset still
          # reports BLOCKED (e.g. a required check has not flipped green yet).
          if gh pr merge "$PR_NUMBER" --squash --delete-branch --repo "$REPO" 2>&1; then
            echo "Merged via squash."
            exit 0
          fi

          if gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --repo "$REPO" 2>&1; then
            echo "Queued for auto-merge."
            exit 0
          fi

          echo "::warning::Both merge attempts failed for PR #$PR_NUMBER. Manual merge may be needed."
          exit 0
