name: Codex auto-request tests

# Runs the offline suite for codex-auto-request.yml. It runs the PR's own copy
# of the decide script against a stub `gh`: no token, no secrets, read-only.
on:
  pull_request:
    paths:
      - .github/workflows/codex-auto-request.yml
      - .github/workflows/codex-auto-request-tests.yml
      - .github/workflows/doc-auto-merge.yml
      - tests/codex-auto-request/**
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-auto-request.yml
      - .github/workflows/codex-auto-request-tests.yml
      - .github/workflows/doc-auto-merge.yml
      - tests/codex-auto-request/**

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: uv run --python 3.12 --with 'PyYAML>=6,<7' python tests/codex-auto-request/test_codex_auto_request.py
