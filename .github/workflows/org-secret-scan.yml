name: Org Secret Scan (gitleaks)

# Scans EVERY non-archived repo in Automation-Architecture for committed
# secrets, across full git history, using gitleaks. This is the org-wide
# coverage layer — one file, all repos — so we don't have to copy a scan
# workflow into 80+ repos.
#
# Runs nightly and on demand. On findings it opens/updates a single tracking
# issue in this (.github) repo (deduped by the `secret-scan` label) and uploads
# redacted per-repo reports as an artifact. Secret VALUES are never logged or
# stored (--redact).
#
# Rotate first, then scrub history — rotation closes the hole; history-rewriting
# is only cleanup (anyone who already cloned still has the old value).
#
# Failure policy (deliberate):
#   - A BROKEN scan always fails loudly (clone failures, gitleaks errors, or
#     zero repos scanned). A security check that goes green when it is broken is
#     worse than no check.
#   - FINDINGS fail the run only on manual/dispatch runs. Scheduled runs do NOT
#     fail on findings: known-but-not-yet-rotated leaks would keep this
#     permanently red and everyone would mute it. The tracking issue is the
#     signal. To make findings fail nightly too, accept the known ones with a
#     gitleaks baseline (`--baseline-path`) and flip the `if:` on the last step.
#
# Prereq: org secret AAA_ORG_TOKEN (same token rollout-monitor.yml uses) must be
# available to this repo. It governs ALL gh/git calls here (it overrides
# GITHUB_TOKEN), so it needs repo read/clone across the org AND issues:write on
# this repo — the `permissions:` block below does not apply to it.

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      only_repo:
        description: 'Scan a single repo (name only, e.g. ic-stripe). Blank = every non-archived repo.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: org-secret-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.AAA_ORG_TOKEN }}
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Check out .github (for shared gitleaks config)
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$url" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Enumerate repos
        env:
          # Passed via env (never interpolated into the script body) so a crafted
          # input can't break out of the shell command.
          ONLY_REPO: ${{ inputs.only_repo }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY_REPO:-}" ]; then
            printf 'Automation-Architecture/%s\n' "$ONLY_REPO" > repos.txt
          else
            gh repo list Automation-Architecture --no-archived --limit 500 \
              --json nameWithOwner --jq '.[].nameWithOwner' > repos.txt
          fi
          echo "Will scan $(wc -l < repos.txt) repo(s):"
          cat repos.txt

      - name: Scan each repo (full history, redacted)
        id: scan
        run: |
          set -uo pipefail
          mkdir -p reports
          : > summary.md
          : > failures.md
          findings_total=0
          repos_with_findings=0
          scanned_ok=0
          clone_failed=0
          scan_errors=0

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            name="${repo#Automation-Architecture/}"
            echo "::group::$repo"
            rm -rf _scan

            if ! git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" _scan; then
              clone_failed=$((clone_failed + 1))
              echo "- **$name** — clone failed" >> failures.md
              echo "::error::clone failed: $repo"
              echo "::endgroup::"; continue
            fi

            report="reports/${name}.json"
            # --exit-code 0 => gitleaks exits 0 even when leaks are found, so a
            # NON-ZERO exit here means gitleaks itself errored (bad config,
            # crash). That must not be mistaken for "clean".
            if gitleaks detect --source _scan --config .gitleaks.toml \
                 --report-format json --report-path "$report" \
                 --redact --no-banner --exit-code 0; then
              scanned_ok=$((scanned_ok + 1))
            else
              scan_errors=$((scan_errors + 1))
              echo "- **$name** — gitleaks errored (scan invalid)" >> failures.md
              echo "::error::gitleaks errored on $repo"
              echo "::endgroup::"; continue
            fi

            n=$(jq 'length' "$report" 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              findings_total=$((findings_total + n))
              repos_with_findings=$((repos_with_findings + 1))
              echo "- **$name** — $n finding(s)" >> summary.md
              jq -r '.[] | "    - `\(.RuleID)` in `\(.File)`"' "$report" \
                | sort -u >> summary.md
            fi
            echo "::endgroup::"
          done < repos.txt

          {
            echo "findings_total=$findings_total"
            echo "repos_with_findings=$repos_with_findings"
            echo "scanned_ok=$scanned_ok"
            echo "clone_failed=$clone_failed"
            echo "scan_errors=$scan_errors"
          } >> "$GITHUB_OUTPUT"
          echo "TOTAL: $findings_total finding(s) across $repos_with_findings repo(s); scanned_ok=$scanned_ok clone_failed=$clone_failed scan_errors=$scan_errors"

      - name: Upload redacted reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: reports/
          retention-days: 14

      - name: Fail if the scan itself was broken
        if: steps.scan.outputs.clone_failed != '0' || steps.scan.outputs.scan_errors != '0' || steps.scan.outputs.scanned_ok == '0'
        run: |
          echo "::error::Secret scan did NOT run cleanly — scanned_ok=${{ steps.scan.outputs.scanned_ok }}, clone_failed=${{ steps.scan.outputs.clone_failed }}, scan_errors=${{ steps.scan.outputs.scan_errors }}."
          echo "Treat this run as INVALID — it is NOT evidence that no secrets exist."
          cat failures.md 2>/dev/null || true
          exit 1

      - name: Open/update tracking issue on findings
        if: steps.scan.outputs.findings_total != '0'
        run: |
          set -euo pipefail
          # Label is the dedupe key (a title search is fuzzy and the title carries
          # counts that change every run).
          gh label create secret-scan --repo Automation-Architecture/.github \
            --color B60205 --description "Automated gitleaks secret-scan findings" 2>/dev/null || true

          title="🔒 Secret scan: ${{ steps.scan.outputs.findings_total }} finding(s) in ${{ steps.scan.outputs.repos_with_findings }} repo(s)"
          {
            echo "gitleaks found committed secrets on $(date -u +%Y-%m-%d)."
            echo
            echo "**Rotate first, then scrub history.** Rotating the live secret closes the hole; rewriting history is only cleanup."
            echo
            cat summary.md
            echo
            echo "_Values are redacted. Full redacted JSON per repo is in this run's \`gitleaks-reports\` artifact._"
            echo "_Auto-generated by \`org-secret-scan.yml\` · run ${{ github.run_id }}._"
          } > issue.md

          existing=$(gh issue list --repo Automation-Architecture/.github --state open \
            --label secret-scan --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo Automation-Architecture/.github --title "$title" --body-file issue.md
            gh issue comment "$existing" --repo Automation-Architecture/.github \
              --body "Re-scanned $(date -u +%Y-%m-%dT%H:%MZ): ${{ steps.scan.outputs.findings_total }} finding(s). Body + artifact updated."
          else
            gh issue create --repo Automation-Architecture/.github --title "$title" \
              --body-file issue.md --label secret-scan
          fi

      - name: Note findings (scheduled runs do not fail on findings)
        if: steps.scan.outputs.findings_total != '0' && github.event_name == 'schedule'
        run: |
          echo "::warning::${{ steps.scan.outputs.findings_total }} finding(s) across ${{ steps.scan.outputs.repos_with_findings }} repo(s) — tracking issue updated. Scheduled runs don't fail on findings (known leaks would keep this permanently red); the issue is the signal."

      - name: Fail the run if any secrets were found (manual runs)
        if: steps.scan.outputs.findings_total != '0' && github.event_name != 'schedule'
        run: |
          echo "::error::gitleaks found ${{ steps.scan.outputs.findings_total }} secret(s). See the tracking issue + artifact."
          exit 1
