name: Review verdict

# CANONICAL COPY (Automation-Architecture/.github). Edit here, never in a repo.
# Promoted from the aaa-client-dashboard advisory pilot (AAA-730) per the ADR
# "the merge gate consumes a verdict we own" (aaa-runbooks
# reference/pr-review-verdict-adr.md, AAA-728).
#
# Publishes one check-run named `review/verdict` on the PR head. The
# `aaa-merge-gates` org ruleset requires it (source: GitHub Actions) on the
# repos it targets; GitHub then enforces it at merge time, with native
# auto-merge doing the merging.
#
# POLICY (Brad, 2026-09-29): Codex is the one required reviewer. Greptile is
# outside the merge policy: nothing here reads it, so it can neither satisfy
# nor block the verdict. No human approval is evidence or is required.
#
# Evidence counted (exactly one kind; nothing else, reactions never):
#   Codex's clean result for this head: an ISSUE comment on this PR,
#   authored by the chatgpt-codex-connector App itself (never a human
#   quoting it), never edited, opening "Codex Review: Didn't find any major
#   issues" and naming exactly one "Reviewed commit" that is a 10+ hex prefix
#   of this head. Codex posts a clean pass this way, not as a review object.
#   Codex's review objects never count: Codex posts one only to carry
#   findings, and a writer can delete the findings, leaving a bare review
#   object (Codex P1 on aios-coffee#122).
# CODEX FINDINGS BLOCK: if Codex left any inline comment whose
# original_commit_id is this head, or any review object on this head, the
# verdict fails for this head whatever else exists. Fixing means a new push
# and a clean Codex pass on it.
# No review object, check-run or approval from anyone else (Greptile, a human,
# another bot) is evidence. A Greptile check or review, passing or failing, is
# ignored. (Until 2026-09-29 a Greptile check or review passed the verdict on
# its own, even over an open Codex finding: Codex P1 on .github#53.)
# The author of the last push is never evidence for that head. Skip notices
# never count.
#
# RESIDUAL, accepted: a clean Codex comment names the head
# it reviewed but not the base, and it is bound to the base only by time
# (posted after the latest retarget). If the author retargets the PR while a
# Codex review is running, the clean comment lands after the retarget and is
# accepted for a diff Codex never reviewed (Codex P1 on aaa-client-dashboard#254).
# Exploiting it needs write access and a retarget inside the few minutes a
# review runs; nothing in the comment or the API records when Codex started.
# (The 10-hex prefix collision this note used to describe is closed:
# .github#48.)
#
# RESIDUAL, accepted: a replaced head's history is listed
# against the CURRENT base. If a Codex review of A is running, the base then
# moves to contain A, and the PR reaches a precomputed head B sharing A's
# 10-hex prefix (by force-push, or by fast-forward so A drops out of the PR's
# commit list), A's late clean comment passes B. Every step must hold at once
# (Codex P1 on .github#50 and opportunity-builder#178).
#
# ── Three things changed from the advisory pilot, all load-bearing ─────────
# 1. NO EVIDENCE IS `action_required`, NEVER `neutral`. GitHub treats neutral,
#    skipped and success as passing a required check; the pilot's neutral
#    "No trusted evidence" would have let an unreviewed PR through.
# 2. `pull_request_target`, not `pull_request`, so this file and its script
#    come from the DEFAULT BRANCH, not the PR. Safe because nothing here checks
#    out or executes PR code: it only reads the API. Do not add a checkout of
#    the PR head to this workflow.
# 3. The script is inline, so there is one file to roll out and no script a PR
#    could swap under a trusted workflow.
#
# ── What this does NOT defend against, and what does ─────────────────────
# `pull_request_review` runs the workflow from the PR's merge ref, and every
# workflow posts checks as the same GitHub Actions app, so a PR that edits
# `.github/workflows/` can publish its own `review/verdict`. A dedicated App
# does not change that: a same-repo PR's workflows can read its key from the
# repo secrets. The ruleset's `dev-ops` approval on `.github/**` used to cover
# this; it was removed on 2026-09-29 (no human approval anywhere), so the gap
# is accepted, not closed. Codex still reviews such a PR (rulesets/README.md).
#
# Triggers:
#   pull_request_target — PR opened/pushed/edited; waits up to WAIT_SECONDS for
#                         the reviewer, exiting early once evidence appears.
#   pull_request_review — a review landed or was dismissed (a Codex review on
#                         the head revokes a pass); re-evaluate immediately.
#   issue_comment       — Codex created/edited/deleted a PR comment. The event
#                         carries no head SHA, so it cannot join the per-head
#                         concurrency group and NEVER publishes. Its `relay`
#                         job reads the current head and dispatches this
#                         workflow (workflow_dispatch, pr_number + head_sha),
#                         which evaluates and publishes like any other run.
#                         GITHUB_TOKEN may trigger workflow_dispatch (the
#                         documented exception to its no-recursion rule).
#   workflow_dispatch   — re-evaluate one PR: pr_number AND its head_sha.
# A new head always gets a new check. Re-runs POST a fresh completed run of
# the same name; the latest one is what GitHub uses.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true
        type: string
      head_sha:
        description: Full head SHA of that PR (joins that commit's concurrency group; a run for a superseded SHA publishes nothing useful)
        required: true
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: read
  issues: read

concurrency:
  # INVARIANT: only a run that will publish may enter the shared group. Every
  # such run re-evaluates from scratch, so whatever it cancels is replaced by
  # a fresh verdict. A run the job `if` skips (a read-only review on a
  # fork/Dependabot PR, any issue_comment, which only relays) gets a
  # throwaway group, because
  # workflow-level concurrency is applied BEFORE the job `if`: in the shared
  # group it could cancel a publisher, notably a dismissal re-evaluation, and
  # publish nothing, leaving a stale `success` as the latest check.
  # The first operand below MUST equal the job `if` exactly. Change both.
  #
  # Shared key = the head SHA, and a run publishes only that SHA (see
  # load_pr), so key and publish target always agree. Evidence for a head is
  # not monotonic (a dismissed review revokes it), which is why publishers are
  # serialized with cancel-in-progress rather than allowed to overlap.
  #
  # History: .github#35 keyed on the event name (fail-open on dismissal);
  # #36 round 1 re-read the current head in an old run (published outside its
  # group); round 2 let skipped check_runs cancel publishers. All Codex finds.
  #
  # workflow_dispatch must name the head SHA (input `head_sha`), so a manual
  # run joins that commit's group and is pinned to it like every other run
  # (Codex on opportunity-builder#165 / aaa-client-dashboard#243: keyed by PR
  # number it could publish a stale `success` after a dismissal).
  group: review-verdict-${{ github.repository }}-${{ (github.event_name != 'issue_comment' && (github.event_name != 'pull_request_review' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && (github.event.pull_request.head.sha || github.event.inputs.head_sha) || format('skipped-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # issue_comment only. Codex posts its clean pass as an issue comment, which
  # carries no head SHA, so this job never evaluates or publishes: it reads
  # the PR's current head and hands off to a workflow_dispatch run, which
  # joins that head's concurrency group like every other publisher. Filtered
  # on the comment's AUTHOR, so a human quoting Codex never triggers it, while
  # anyone's edit or deletion of a Codex comment does (both can revoke
  # evidence). No checkout, and no event text is interpolated into the script.
  relay:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch review/verdict for the PR's current head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "/repos/$REPO/pulls/$PR_NUMBER")
          state=$(echo "$pr_json" | jq -r '.state // empty')
          head=$(echo "$pr_json" | jq -r '.head.sha // empty')
          if [ "$state" != "open" ]; then
            echo "#$PR_NUMBER is ${state:-unreadable}; nothing to re-evaluate."
            exit 0
          fi
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read a head SHA for #$PR_NUMBER."
            exit 1
          fi
          # GITHUB_WORKFLOW_REF = owner/repo/.github/workflows/<file>@<ref>
          wf="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
          wf="${wf%@*}"
          echo "Dispatching $wf on $DEFAULT_BRANCH for #$PR_NUMBER at ${head:0:7}"
          gh workflow run "$wf" --repo "$REPO" --ref "$DEFAULT_BRANCH" \
            -f pr_number="$PR_NUMBER" -f head_sha="$head"

  publish:
    # pull_request_review on a fork or Dependabot PR gets a READ-ONLY token, so
    # it cannot publish; skip it rather than fail. Those PRs get their verdict
    # from the pull_request_target poll (up to WAIT_SECONDS) or a
    # workflow_dispatch (the Codex comment relay). Never a pass: a skipped run
    # publishes nothing, and the head keeps its action_required verdict until
    # then.
    if: >
      github.event_name != 'issue_comment' &&
      (github.event_name != 'pull_request_review' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    steps:
      # No checkout: this job reads the GitHub API only. Keep it that way;
      # under pull_request_target a checkout of the PR head would run
      # untrusted code with a write token.
      - name: Evaluate and publish review/verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.head_sha || '' }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The one reviewer whose output is evidence (its clean comment) and
          # whose findings veto. The App slug is checked on every comment.
          CODEX_BOT: "chatgpt-codex-connector[bot]"
          CODEX_APP: "chatgpt-codex-connector"
          # Same string as auto-merge.yml's REVIEW_SKIP_PATTERN. Keep in step.
          REVIEW_SKIP_PATTERN: "review (was )?skipped|skipping (this )?review|could not (complete|finish|review)|unable to review|rate.?limit|quota exceeded|spend limit"
          # Codex lands a few minutes after a push. Other events evaluate once.
          WAIT_SECONDS: ${{ github.event_name == 'pull_request_target' && '600' || '0' }}
          PUBLISH: "1"
        run: |
          # review/verdict adapter (AAA-728 / AAA-730), canonical copy.
          #
          # Reads reviewer output for one PR at one head and publishes a check-run named
          # `review/verdict` on that head. The `aaa-merge-gates` org ruleset requires it
          # on the repos it targets. The adapter judges no code; Codex is the
          # reviewer.
          #
          # Evidence (nothing else counts; reactions never count): a clean Codex
          # issue comment naming the head as its reviewed commit. Any Codex
          # finding on the head (inline comment or review object) fails the
          # verdict. Greptile, humans and other bots are never read.
          #
          # Fails closed: no evidence means no successful verdict. A vendor renaming a
          # check or rewording a comment can cost a verdict; it can never buy one.
          set -euo pipefail

          REPO="${REPO:?REPO is required}"
          EVENT="${EVENT:-workflow_dispatch}"
          PR_NUMBER="${PR_NUMBER:-}"
          HEAD_SHA_HINT="${HEAD_SHA:-}"
          PR_ACTION="${PR_ACTION:-}"
          PUBLISH="${PUBLISH:-1}"
          WAIT_SECONDS="${WAIT_SECONDS:-0}"
          CODEX_BOT="${CODEX_BOT:-chatgpt-codex-connector[bot]}"
          CODEX_APP="${CODEX_APP:-chatgpt-codex-connector}"
          # Canonical copy: Automation-Architecture/.github .github/workflows/auto-merge.yml
          # (AAA-711: the better idea; skip notices are status, not a verdict).
          REVIEW_SKIP_PATTERN="${REVIEW_SKIP_PATTERN:-review (was )?skipped|skipping (this )?review|could not (complete|finish|review)|unable to review|rate.?limit|quota exceeded|spend limit}"

          CHECK_NAME="review/verdict"

          HEAD_SHA=""
          SUPERSEDED=0
          BASE_REF=""
          BASE_SHA=""
          PR_CREATED=""
          PR_STATE=""
          EVIDENCE=""
          MISSING_REASONS=()
          # 1 = the verdict fails for this head: Codex has findings on it, or
          # they could not be read. Nothing overrides it.
          CODEX_BLOCKED=0
          # NEVER "neutral": GitHub counts neutral, skipped and success as passing a
          # required check, so a neutral "no evidence" verdict would let an unreviewed
          # PR through the ruleset. action_required is completed but not passing.
          CONCLUSION="action_required"
          TITLE="Waiting for a clean Codex review"

          fail_closed_reason() {
            MISSING_REASONS+=("$1")
          }

          require_config() {
            if [ -z "${CODEX_BOT// /}" ] || [ -z "${CODEX_APP// /}" ] \
               || [ -z "${REVIEW_SKIP_PATTERN// /}" ]; then
              echo "::error::CODEX_BOT / CODEX_APP / REVIEW_SKIP_PATTERN is empty — refusing a successful verdict."
              fail_closed_reason "adapter configuration is empty, so no verdict can be issued"
              return 1
            fi
            return 0
          }

          # Resolve the PR this run is about. pull_request_target / pull_request_review /
          # workflow_dispatch bind by construction and always set PR_NUMBER. The
          # lookup below is a fail-closed fallback for a run without one: it
          # refuses when two open PRs share the head (the leak AAA-711 recorded).
          resolve_pr() {
            if [ -n "$PR_NUMBER" ]; then
              return 0
            fi
            if [ -z "$HEAD_SHA_HINT" ]; then
              fail_closed_reason "no pull request number and no head SHA were provided"
              return 1
            fi
            local associated
            if ! associated=$(gh api --paginate "/repos/$REPO/commits/$HEAD_SHA_HINT/pulls"); then
              fail_closed_reason "could not list pull requests for head $HEAD_SHA_HINT"
              return 1
            fi
            local open_at_head
            open_at_head=$(echo "$associated" | jq --arg sha "$HEAD_SHA_HINT" \
              '[.[] | select(.state == "open" and .head.sha == $sha)]')
            local n
            n=$(echo "$open_at_head" | jq 'length')
            if [ "$n" -eq 1 ]; then
              PR_NUMBER=$(echo "$open_at_head" | jq -r '.[0].number')
              return 0
            fi
            if [ "$n" -eq 0 ]; then
              fail_closed_reason "no open pull request currently has head $HEAD_SHA_HINT"
              HEAD_SHA="$HEAD_SHA_HINT"
              return 1
            fi
            local listed
            listed=$(echo "$open_at_head" | jq -r '[.[].number] | map("#\(.)") | join(", ")')
            fail_closed_reason "head $HEAD_SHA_HINT is in multiple open PRs ($listed), so a check on this commit cannot be attributed to one of them"
            HEAD_SHA="$HEAD_SHA_HINT"
            return 1
          }

          load_pr() {
            local pr_json
            if ! pr_json=$(gh api "/repos/$REPO/pulls/$PR_NUMBER"); then
              fail_closed_reason "could not read pull request #$PR_NUMBER"
              return 1
            fi
            HEAD_SHA=$(echo "$pr_json" | jq -r '.head.sha // empty')
            BASE_REF=$(echo "$pr_json" | jq -r '.base.ref // empty')
            BASE_SHA=$(echo "$pr_json" | jq -r '.base.sha // empty')
            PR_CREATED=$(echo "$pr_json" | jq -r '.created_at // empty')
            PR_STATE=$(echo "$pr_json" | jq -r '.state // empty')
            PR_NODE=$(echo "$pr_json" | jq -r '.node_id // empty')
            PR_COMMIT_COUNT=$(echo "$pr_json" | jq -r '.commits // empty')
            if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ] \
               || [ -z "$BASE_REF" ] || [ -z "$BASE_SHA" ] || [ -z "$PR_CREATED" ]; then
              fail_closed_reason "pull request #$PR_NUMBER is missing head SHA, base ref, base SHA, or created_at"
              return 1
            fi
            # A run evaluates and publishes ONLY the commit it was triggered for,
            # which is the commit its concurrency group is keyed on. If the PR has
            # moved on, the newer head belongs to a newer run in its own group; this
            # run must not evaluate or publish there (Codex on .github#36: an old
            # poll re-reading the current head published outside that head's group).
            # It publishes action_required on its own, now-superseded commit, which
            # no longer decides anything, and stops polling.
            if [ -n "$HEAD_SHA_HINT" ] && [ "$HEAD_SHA" != "$HEAD_SHA_HINT" ]; then
              fail_closed_reason "this run was triggered for ${HEAD_SHA_HINT:0:7}, but the PR head is now ${HEAD_SHA:0:7}; the newer head is evaluated by its own run"
              HEAD_SHA="$HEAD_SHA_HINT"
              SUPERSEDED=1
              return 1
            fi
            return 0
          }

          # GitHub users who produced the head commit. A fixer (or anyone) is not
          # trusted evidence for a head they just pushed — independence is load-bearing.
          last_push_logins_json() {
            local commit
            if ! commit=$(gh api "/repos/$REPO/commits/$HEAD_SHA"); then
              return 1
            fi
            echo "$commit" | jq '[.author.login // empty, .committer.login // empty] | map(select(length > 0)) | unique'
          }

          # Codex findings on THIS head fail the verdict for it, whatever else exists.
          # A finding is an inline review comment by Codex whose
          # original_commit_id is this head (commit_id moves with later pushes;
          # original_commit_id does not), OR any Codex review object on this
          # head, dismissed or not. Codex posts a review object only to carry
          # findings, and unlike an inline comment it cannot be deleted, so a
          # writer deleting the findings or dismissing the review does not
          # clear the veto (Codex P1 on aios-coffee#122). Unreadable counts as
          # blocked.
          load_codex_findings() {
            CODEX_BLOCKED=0
            local comments n
            if ! comments=$(gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/comments" --jq '.[]' | jq -s '.'); then
              CODEX_BLOCKED=1
              fail_closed_reason "could not read inline review comments for #$PR_NUMBER, so Codex evidence cannot be shown to be free of findings"
              return 0
            fi
            if ! n=$(echo "$comments" | jq --arg c "$CODEX_BOT" --arg sha "$HEAD_SHA" \
                  '[.[] | select(.user.login == $c and .original_commit_id == $sha)] | length'); then
              CODEX_BLOCKED=1
              fail_closed_reason "could not evaluate Codex's inline comments for #$PR_NUMBER"
              return 0
            fi
            if [ "$n" -gt 0 ]; then
              CODEX_BLOCKED=1
              fail_closed_reason "Codex left ${n} inline finding(s) on this head, so no Codex comment counts for it; push a fix and get a clean Codex pass on the new head"
              return 0
            fi
            local reviews
            if ! reviews=$(gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[]' | jq -s '.'); then
              CODEX_BLOCKED=1
              fail_closed_reason "could not read reviews for #$PR_NUMBER, so Codex evidence cannot be shown to be free of findings"
              return 0
            fi
            if ! n=$(echo "$reviews" | jq --arg c "$CODEX_BOT" --arg sha "$HEAD_SHA" \
                  '[.[] | select(.user.login == $c and .commit_id == $sha)] | length'); then
              CODEX_BLOCKED=1
              fail_closed_reason "could not evaluate Codex's reviews for #$PR_NUMBER"
              return 0
            fi
            if [ "$n" -gt 0 ]; then
              CODEX_BLOCKED=1
              fail_closed_reason "Codex submitted ${n} review(s) with findings on this head (the findings may since have been deleted or the review dismissed), so no Codex comment counts for it; push a fix and get a clean Codex pass on the new head"
            fi
            return 0
          }

          # The only evidence: Codex's clean pass, which Codex posts as an ISSUE comment,
          # not a review object. Every test below must hold; any doubt refuses.
          #  - author is the Codex App's bot account (a [bot] login cannot belong
          #    to a person) AND the comment was posted via the Codex App;
          #  - body OPENS with the clean-result sentence, so a quote inside a
          #    longer comment never matches, and does not match REVIEW_SKIP_PATTERN;
          #  - exactly one "Reviewed commit" SHA, 10-40 hex, a prefix of this head;
          #  - never edited (a writer can edit another user's comment), read from
          #    GraphQL lastEditedAt. An edit fires issue_comment `edited`, so a
          #    pass already published is re-evaluated. Minimising (hiding) is
          #    deliberately NOT a revocation: it fires no event, so the rule could
          #    not be enforced after a pass was published (Codex P1 on
          #    aaa-client-dashboard#252), and hiding a clean bot comment asserts
          #    nothing about the code. Revoke a pass by pushing, or by deleting the
          #    comment (issue_comment `deleted` re-evaluates);
          #  - Codex is not an author of the head commit;
          #  - posted AFTER the PR's latest retarget and head force-push, so a
          #    pass on the same head against another base, or on a head a
          #    force-push replaced, never carries over (Codex P1 on
          #    aios-coffee#122). Read from the typed GraphQL timeline. Both events
          #    re-run this workflow (`edited`, `synchronize`). A base force-push
          #    does not, so, like a base advance, it is left to the Base-sha the
          #    verdict records rather than a rule no run could enforce after a
          #    pass was published (Codex P1 on .github#48);
          #  - no OTHER commit this PR has ever carried starts with the Reviewed
          #    commit prefix (Greptile P1 on aios-coffee#122). A 10-hex collision
          #    is a cheap birthday search for whoever pushes both commits. Every
          #    earlier head is either still in the PR's commit list (fast-forward)
          #    or in the history of a head a force-push replaced, which the
          #    timeline records by SHA. The time rule alone does not cover the
          #    latter: a review of head A can still be running when a colliding
          #    head B is force-pushed, and its comment then lands after the push
          #    (Codex P1 on opportunity-builder#178).
          evidence_from_codex_comment() {
            if [ "$CODEX_BLOCKED" = "1" ]; then
              return 1
            fi
            local comments candidates n
            if ! comments=$(gh api --paginate "/repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[]' | jq -s '.'); then
              fail_closed_reason "could not read issue comments for #$PR_NUMBER"
              return 1
            fi
            if ! candidates=$(echo "$comments" | jq --arg bot "$CODEX_BOT" --arg app "$CODEX_APP" \
                  --arg sha "$HEAD_SHA" --arg skip "$REVIEW_SKIP_PATTERN" '
              def reviewed: [scan("\\*\\*Reviewed commit:\\*\\* `([0-9a-f]{10,40})`") | .[0]];
              [.[]
                | select(
                    .user.login == $bot and .user.type == "Bot"
                    and (.performed_via_github_app.slug // "") == $app
                    and ((.body // "") | test("\\ACodex Review: Didn.t find any major issues"))
                    and (((.body // "") | test($skip; "i")) | not)
                    and ((.body // "") | reviewed | length == 1)
                    and ((.body // "") | reviewed | .[0] as $s | $sha | startswith($s))
                  )
                | {node_id, created_at, reviewed: ((.body // "") | reviewed | .[0])}
              ] | sort_by(.created_at) | reverse'); then
              fail_closed_reason "could not evaluate Codex comments for #$PR_NUMBER"
              return 1
            fi
            n=$(echo "$candidates" | jq 'length')
            if [ "$n" -eq 0 ]; then
              fail_closed_reason "no clean Codex result names this head as its reviewed commit"
              return 1
            fi

            local pushers
            if ! pushers=$(last_push_logins_json); then
              fail_closed_reason "could not read the author of head $HEAD_SHA"
              return 1
            fi
            if echo "$pushers" | jq -e --arg c "$CODEX_BOT" 'index($c)' >/dev/null; then
              fail_closed_reason "the author of the last push is ${CODEX_BOT}, who is not trusted evidence for this head"
              return 1
            fi

            # Bind to this base and this line of heads: only comments posted after
            # the latest retarget or head force-push count.
            if [ -z "$PR_NODE" ]; then
              fail_closed_reason "pull request #$PR_NUMBER has no node_id, so its retarget and force-push history cannot be read"
              return 1
            fi
            local timeline cutoff
            # shellcheck disable=SC2016 # $id is a GraphQL variable, not shell
            if ! timeline=$(gh api graphql -f id="$PR_NODE" -f query='
                query($id: ID!) { node(id: $id) { ... on PullRequest {
                  timelineItems(last: 100, itemTypes: [BASE_REF_CHANGED_EVENT, HEAD_REF_FORCE_PUSHED_EVENT]) {
                    pageInfo { hasPreviousPage }
                    nodes {
                      ... on BaseRefChangedEvent { createdAt }
                      ... on HeadRefForcePushedEvent { createdAt beforeCommit { oid } } } } } } }'); then
              fail_closed_reason "could not read the retarget and head force-push history of #$PR_NUMBER"
              return 1
            fi
            if ! cutoff=$(echo "$timeline" | jq -er '
                .data.node.timelineItems
                | if .pageInfo.hasPreviousPage != false then error("more than 100 events") else .nodes end
                | if type != "array" then error("no timeline")
                  else (map(.createdAt // error("event without createdAt")) | max // "") end'); then
              fail_closed_reason "could not read the retarget and head force-push history of #$PR_NUMBER"
              return 1
            fi
            if [ -n "$cutoff" ]; then
              # Strictly after: a comment in the same second as the event refuses.
              if ! candidates=$(echo "$candidates" | jq --arg cut "$cutoff" '
                  def parse: sub("\\.[0-9]+";"") | sub("\\+00:00$";"Z") | fromdateiso8601;
                  ($cut | parse) as $c | map(select((.created_at | parse) > $c))'); then
                fail_closed_reason "could not compare Codex comment times with the retarget and head force-push history"
                return 1
              fi
              if [ "$(echo "$candidates" | jq 'length')" -eq 0 ]; then
                fail_closed_reason "every clean Codex comment naming this head predates the latest retarget or head force-push (${cutoff}), so it may cover a different diff"
                return 1
              fi
            fi

            # A Reviewed commit prefix must name only this head among the PR's
            # commits. The list endpoint stops at 250, so a longer PR refuses.
            if ! [[ "$PR_COMMIT_COUNT" =~ ^[0-9]+$ ]] || [ "$PR_COMMIT_COUNT" -gt 250 ]; then
              fail_closed_reason "#$PR_NUMBER has ${PR_COMMIT_COUNT:-an unknown number of} commits, too many to show a Reviewed commit prefix names only this head"
              return 1
            fi
            local pr_shas
            if ! pr_shas=$(gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[]' | jq -s 'map(.sha)'); then
              fail_closed_reason "could not list the commits of #$PR_NUMBER"
              return 1
            fi
            if [ "$(echo "$pr_shas" | jq 'length')" -ne "$PR_COMMIT_COUNT" ]; then
              fail_closed_reason "the commit list of #$PR_NUMBER is incomplete, so a Reviewed commit prefix cannot be shown to name only this head"
              return 1
            fi
            # Add every head a force-push replaced, and its history past the base.
            local replaced oid history
            if ! replaced=$(echo "$timeline" | jq -r '
                [.data.node.timelineItems.nodes[] | select(has("beforeCommit"))
                  | (.beforeCommit.oid // error("force-push without a before commit"))] | unique | .[]'); then
              fail_closed_reason "a head force-push on #$PR_NUMBER does not record the commit it replaced"
              return 1
            fi
            for oid in $replaced; do
              # Paged: one response lists at most 250 commits (Greptile P1 on
              # aios-coffee#122); every page repeats total_commits.
              if ! history=$(gh api --paginate "/repos/$REPO/compare/$BASE_SHA...$oid?per_page=100" \
                  | jq -es --arg oid "$oid" '([.[].commits[].sha] | unique) as $s
                      | if ($s | length) == .[0].total_commits
                        then [$oid] + $s else error("incomplete") end'); then
                fail_closed_reason "could not list the full history of ${oid:0:10}, a head replaced by a force-push, so a Reviewed commit prefix cannot be shown to name only this head"
                return 1
              fi
              pr_shas=$(jq -n --argjson a "$pr_shas" --argjson b "$history" '$a + $b | unique')
            done
            if ! candidates=$(echo "$candidates" | jq --argjson shas "$pr_shas" --arg sha "$HEAD_SHA" '
                map(.reviewed as $r | select([$shas[] | select(. != $sha and startswith($r))] | length == 0))'); then
              fail_closed_reason "could not check Codex Reviewed commit prefixes against the commits of #$PR_NUMBER"
              return 1
            fi
            if [ "$(echo "$candidates" | jq 'length')" -eq 0 ]; then
              fail_closed_reason "the Reviewed commit prefix in every clean Codex comment also matches another commit this PR has carried, so it does not identify this head"
              return 1
            fi

            local node meta ok
            for node in $(echo "$candidates" | jq -r '.[].node_id'); do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not shell
              if ! meta=$(gh api graphql -f id="$node" -f query='
                  query($id: ID!) { node(id: $id) { ... on IssueComment {
                    lastEditedAt author { login } } } }'); then
                continue
              fi
              ok=$(echo "$meta" | jq -r --arg app "$CODEX_APP" '
                .data.node as $c
                | if $c == null then "no"
                  elif ($c.author.login // "") != $app then "no"
                  elif $c.lastEditedAt != null then "no"
                  else "yes" end')
              if [ "$ok" = "yes" ]; then
                EVIDENCE="a clean Codex result for this head: an unedited issue comment by ${CODEX_BOT} (posted via the ${CODEX_APP} app) whose Reviewed commit is a prefix of ${HEAD_SHA:0:10} and of no other commit this PR has carried, posted after the latest retarget or head force-push, and no Codex findings on this head"
                return 0
              fi
            done
            fail_closed_reason "clean Codex comment(s) name this head but were edited or unreadable, so they do not count"
            return 1
          }

          evaluate_once() {
            EVIDENCE=""
            MISSING_REASONS=()
            CONCLUSION="action_required"
            TITLE="Waiting for a clean Codex review"
            CODEX_BLOCKED=0

            # Identity first so a fail-closed verdict can still land on the head SHA.
            if ! resolve_pr; then
              return 0
            fi
            if ! load_pr; then
              return 0
            fi

            require_config || true
            if [ ${#MISSING_REASONS[@]} -gt 0 ]; then
              return 0
            fi

            if [ "$PR_STATE" != "open" ]; then
              if [ "$PUBLISH" = "1" ]; then
                fail_closed_reason "pull request #$PR_NUMBER is $PR_STATE"
                return 0
              fi
              echo "::notice::#$PR_NUMBER is $PR_STATE — evaluating anyway because PUBLISH=0."
            fi

            # Codex is the one reviewer. Its findings on this head fail the
            # verdict; only its clean pass on this head can pass it. Greptile,
            # humans and other bots are not read at all.
            load_codex_findings
            if [ "$CODEX_BLOCKED" = "1" ]; then
              TITLE="Codex findings on this head"
              return 0
            fi
            if evidence_from_codex_comment; then
              CONCLUSION="success"
              TITLE="Reviewed by Codex"
              return 0
            fi
            fail_closed_reason "only a clean Codex pass on this head counts; reactions, Greptile and human approvals are not evidence"
            return 0
          }

          build_summary() {
            local evidence_text missing_text
            if [ -n "$EVIDENCE" ]; then
              evidence_text="$EVIDENCE"
            else
              if [ ${#MISSING_REASONS[@]} -eq 0 ]; then
                missing_text="no clean Codex pass on this head was found"
              else
                missing_text=$(printf '%s; ' "${MISSING_REASONS[@]}" | sed 's/; $//')
              fi
              evidence_text="no successful verdict. ${missing_text}"
            fi

            cat <<EOF
          \`review/verdict\` (AAA-728). Required by the \`aaa-merge-gates\` ruleset on the repos it targets.

          - **PR:** #${PR_NUMBER:-unknown}
          - **Base-ref:** ${BASE_REF:-unknown}
          - **Base-sha:** ${BASE_SHA:-unknown}
          - **Head-sha:** ${HEAD_SHA:-unknown}
          - **Evidence:** ${evidence_text}

          PR: ${PR_NUMBER:-}
          Base-ref: ${BASE_REF:-}
          Base-sha: ${BASE_SHA:-}
          Head-sha: ${HEAD_SHA:-}
          Evidence: ${evidence_text}
          EOF
          }

          publish_check() {
            local summary title conclusion sha
            sha="${HEAD_SHA:-$HEAD_SHA_HINT}"
            if [ -z "$sha" ] || [ "$sha" = "null" ]; then
              echo "::error::No head SHA to publish $CHECK_NAME on."
              return 1
            fi
            summary=$(build_summary)
            title="$TITLE"
            conclusion="$CONCLUSION"
            if [ ${#title} -gt 240 ]; then
              title="${title:0:237}..."
            fi

            echo "Publishing $CHECK_NAME on ${sha:0:7} conclusion=$conclusion"
            echo "$summary"

            if [ "$PUBLISH" != "1" ]; then
              echo "PUBLISH=0 — not writing a check-run."
              return 0
            fi

            local payload
            payload=$(jq -n \
              --arg name "$CHECK_NAME" \
              --arg sha "$sha" \
              --arg conclusion "$conclusion" \
              --arg title "$title" \
              --arg summary "$summary" \
              --arg details "${DETAILS_URL:-https://github.com/$REPO/pull/${PR_NUMBER:-}}" \
              '{
                name: $name,
                head_sha: $sha,
                status: "completed",
                conclusion: $conclusion,
                details_url: $details,
                output: { title: $title, summary: $summary }
              }')
            echo "$payload" | gh api -X POST "/repos/$REPO/check-runs" --input - >/dev/null
          }

          # On pull_request_target we may arrive before Codex has posted. Wait (and exit
          # early once evidence appears) so a verdict lands within a minute of the
          # reviewer finishing even before this workflow exists on the default
          # branch (the issue_comment relay and pull_request_review triggers run
          # from there).
          if [ "$WAIT_SECONDS" -gt 0 ] && [ "$EVENT" = "pull_request_target" ] && [ "$PR_ACTION" != "edited" ]; then
            :
          else
            WAIT_SECONDS=0
          fi

          deadline=$((SECONDS + WAIT_SECONDS))
          while true; do
            evaluate_once
            if [ -n "$EVIDENCE" ] || [ "$SUPERSEDED" = "1" ] || [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            printf 'No evidence yet; waiting for a clean Codex result on this head, up to %ss.\n' \
              "$WAIT_SECONDS"
            sleep 20
          done

          publish_check
          if [ -n "$EVIDENCE" ]; then
            printf 'Verdict: success — %s\n' "$EVIDENCE"
          else
            missing_text="${MISSING_REASONS[*]}"
            printf 'Verdict: no successful verdict — %s\n' "${missing_text:-nothing recorded}"
          fi
