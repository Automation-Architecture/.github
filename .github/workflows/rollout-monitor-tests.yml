name: Rollout monitor tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  suite:
    name: rollout monitor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/rollout-monitor -v
