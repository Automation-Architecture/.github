name: Rollout PR Monitor

# Runs hourly. For each open rollout PR (branches matching the patterns below),
# the monitor does two things:
#
#   1. PATCH — if any workflow file in the PR branch differs from the canonical
#      version in this repo's main, push an update. This handles the bootstrap
#      problem where findings-fixer.yml can't run until it's on main, and
#      ensures all rollout PRs always carry the current canonical content.
#
#   2. MERGE — if CI is clean and Copilot inline findings on HEAD SHA = 0,
#      admin-merge (squash + delete-branch) the PR.
#
# Skips PRs whose CI has hard failures (those need human attention).
#
# A single rollout branch may carry MORE THAN ONE canonical file (e.g. the
# bundled auto-merge + findings-fixer rollout). PATTERNS therefore maps a
# branch name to a LIST of canonical file paths; the PATCH step syncs every
# listed file before the PR is eligible to merge.
#
# PREREQUISITE:
#   AAA_ORG_TOKEN must be set as an org-level Actions secret.
#   A classic PAT with repo + workflow scope on the Automation-Architecture org.
#   gh secret set AAA_ORG_TOKEN --org Automation-Architecture
#   (Store in 1Password under aaa-APIs; item name: aaa-org-token)
#   Until set, each step will fail with 401 and the monitor is a no-op.
#
# Rollout branches and their canonical source file(s) (in this repo's main):
#   feat/add-auto-merge-workflow  → auto-merge.yml + findings-fixer.yml (bundled)
#   feat/auto-merge-workflow      → auto-merge.yml      (legacy single-file)
#   feat/findings-fixer-workflow  → findings-fixer.yml  (legacy single-file)
#   feat/dashboard-sync-workflow  → dashboard-sync.yml
#   feat/sentry-release-workflow  → sentry-release.yml

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:        # manual trigger for testing / on-demand drain

permissions:
  contents: read  # only needs read on this repo; writes go via AAA_ORG_TOKEN

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for reading canonical workflow files

      - name: Monitor and drain rollout PRs
        env:
          GH_TOKEN: ${{ secrets.AAA_ORG_TOKEN }}
          ORG: Automation-Architecture
        run: |
          python3 << 'PYEOF'
          import base64, json, os, subprocess, time, urllib.parse

          ORG = os.environ["ORG"]
          GH_TOKEN = os.environ["GH_TOKEN"]

          # Rollout branch → list of canonical file paths in this repo.
          # The bundled branch (both files on one branch) is listed FIRST so a
          # PR is processed under it before any single-file pattern; the `seen`
          # set below prevents double-processing if GitHub head: search matches
          # a PR under more than one pattern.
          AM = ".github/workflows/auto-merge.yml"
          FF = ".github/workflows/findings-fixer.yml"
          PATTERNS = {
              "feat/add-auto-merge-workflow": [AM, FF],
              "feat/auto-merge-workflow":     [AM],
              "feat/findings-fixer-workflow": [FF],
              "feat/dashboard-sync-workflow": [".github/workflows/dashboard-sync.yml"],
              "feat/sentry-release-workflow": [".github/workflows/sentry-release.yml"],
          }

          _FAILING = frozenset({"failure", "timed_out", "cancelled", "action_required"})
          _PENDING  = frozenset({"in_progress", "queued", "waiting", "requested"})

          def gh(*args, check=True):
              r = subprocess.run(["gh"] + list(args), capture_output=True, text=True,
                                 env={**os.environ, "GH_TOKEN": GH_TOKEN})
              if check and r.returncode != 0:
                  raise RuntimeError(r.stderr.strip()[:120])
              return r

          def gh_json(*args):
              r = gh("api", "--paginate", *args)
              raw = r.stdout.strip()
              if not raw:
                  return []
              try:
                  obj = json.loads(raw)
                  if isinstance(obj, list):
                      flat = []
                      for item in obj:
                          (flat.extend(item) if isinstance(item, list) else flat.append(item))
                      return flat
                  return obj
              except json.JSONDecodeError:
                  return []

          def find_open_prs(branch):
              """Find open PRs using gh api /search/issues.

              Uses the same gh() wrapper as all other API calls so the GH_TOKEN
              env var is passed consistently — avoids the urllib 401 failure and
              the silent-empty-result issue with gh search prs.
              """
              q = urllib.parse.quote(f"org:{ORG} is:pr is:open head:{branch}")
              r = gh("api", f"/search/issues?q={q}&per_page=100", check=False)
              if r.returncode != 0:
                  print(f"  ⚠ search failed ({r.stderr.strip()[:60]})")
                  return []
              try:
                  items = json.loads(r.stdout).get("items", [])
              except (json.JSONDecodeError, AttributeError):
                  return []
              results = []
              for item in items:
                  parts = item["html_url"].rstrip("/").split("/")
                  results.append({
                      "number": item["number"],
                      "repository": {"nameWithOwner": f"{parts[-4]}/{parts[-3]}"},
                  })
              return results

          def get_pr_sha(repo_full, pr_num):
              r = gh("api", f"/repos/{repo_full}/pulls/{pr_num}", "--jq", ".head.sha", check=False)
              return r.stdout.strip() if r.returncode == 0 else ""

          def get_pr_branch(repo_full, pr_num):
              r = gh("api", f"/repos/{repo_full}/pulls/{pr_num}", "--jq", ".head.ref", check=False)
              return r.stdout.strip() if r.returncode == 0 else ""

          def check_runs_state(repo_full, sha):
              try:
                  runs = gh_json(f"/repos/{repo_full}/commits/{sha}/check-runs", "--jq", ".check_runs[]")
              except RuntimeError:
                  return "error"
              if not runs:
                  return "no-ci"
              if any(r.get("conclusion") in _FAILING for r in runs):
                  return "failed"
              if any(r.get("status") in _PENDING for r in runs):
                  return "pending"
              return "clean"

          def copilot_count(repo_full, pr_num, sha):
              try:
                  comments = gh_json(
                      f"/repos/{repo_full}/pulls/{pr_num}/comments",
                      "--jq", f'.[] | select(.original_commit_id == "{sha}" and .user.login == "Copilot")',
                  )
                  return len(comments) if isinstance(comments, list) else (1 if comments else 0)
              except RuntimeError:
                  return -1

          def get_file_content_on_branch(repo_full, branch, path):
              # → (status, content, sha) with status in {"ok","missing","error"}.
              # Distinguish a genuine 404 (file absent → safe to create) from any
              # other API failure (rate limit / perms / 5xx → do NOT treat as
              # missing, or we'd create spurious files / mask the real error).
              # -X GET is REQUIRED: gh api defaults to POST when any -f/-F field
              # is present, which would POST to the contents endpoint and 404.
              r = gh("api",
                     "-X", "GET",
                     f"/repos/{repo_full}/contents/{path}",
                     "-f", f"ref={branch}",
                     check=False)
              if r.returncode == 0:
                  try:
                      data = json.loads(r.stdout)
                      return "ok", base64.b64decode(data["content"].replace("\n","")).decode(), data["sha"]
                  except (ValueError, KeyError):
                      return "error", None, None
              err = (r.stderr or "").lower()
              if "not found" in err or "404" in err:
                  return "missing", None, None
              return "error", None, None

          def patch_file(repo_full, branch, path, content, file_sha):
              # file_sha None ⇒ the file is absent on the branch ⇒ create it
              # (PUT without sha). Otherwise update in place.
              content_b64 = base64.b64encode(content.encode()).decode()
              verb = "sync" if file_sha else "add"
              args = ["api", f"/repos/{repo_full}/contents/{path}",
                      "-X", "PUT",
                      "-f", f"message=fix(workflows): {verb} {path.split('/')[-1]} from canonical",
                      "-f", f"content={content_b64}",
                      "-f", f"branch={branch}"]
              if file_sha:
                  args += ["-f", f"sha={file_sha}"]
              r = gh(*args, check=False)
              if r.returncode == 0:
                  return True, ""
              # Surface the API error so a failed write is self-diagnosing
              # (e.g. a token missing `workflow` scope returns a clear 403 here).
              detail = (r.stderr or r.stdout or "").strip().replace("\n", " ")[:160]
              return False, detail

          def merge_pr(repo_full, pr_num):
              r = gh("pr", "merge", str(pr_num),
                     "--admin", "--squash", "--delete-branch",
                     "--repo", repo_full, check=False)
              if r.returncode != 0:
                  # Fall back to --auto if admin bypass fails
                  r2 = gh("pr", "merge", str(pr_num),
                          "--auto", "--squash", "--delete-branch",
                          "--repo", repo_full, check=False)
                  return r2.returncode == 0, (r2.stdout + r2.stderr).strip()[:80]
              return True, "merged"

          # Load canonical file contents from this checkout, per branch.
          # If ANY listed file is missing locally, skip the WHOLE branch — a
          # partial set would let a PR merge without all its files synced
          # (treat a missing canonical file as a configuration error).
          canonical = {}
          for branch in PATTERNS:
              files = {}
              complete = True
              for path in PATTERNS[branch]:
                  try:
                      with open(path) as f:
                          files[path] = f.read()
                  except OSError:
                      print(f"  ⚠ canonical {path} not found — skipping ENTIRE branch {branch} (config error)")
                      complete = False
                      break
              if complete and files:
                  canonical[branch] = files

          totals = {"merged": 0, "patched": 0, "pending": 0, "failed": 0, "error": 0}
          seen = set()  # (repo_full, pr_num) — process each PR once across patterns

          for branch in PATTERNS:
              if branch not in canonical:
                  continue
              files = canonical[branch]
              print(f"\n── {branch} ──")
              prs = find_open_prs(branch)
              if not prs:
                  print("  (no open PRs)")
                  continue
              print(f"  {len(prs)} open PR(s)")

              for pr in prs:
                  pr_num = pr["number"]
                  repo_full = pr["repository"]["nameWithOwner"]
                  key = (repo_full, pr_num)
                  if key in seen:
                      continue

                  label = f"{repo_full.split('/')[1]:<40} #{pr_num:<5}"

                  # GitHub head: search is fuzzy — confirm the PR's real head ref
                  # matches THIS pattern before claiming it.
                  real_branch = get_pr_branch(repo_full, pr_num)
                  if not real_branch:
                      # API error fetching the ref — surface it, don't silently
                      # skip (and don't mark seen: let a later pass retry).
                      print(f"  ? {label} head-ref fetch failed (API error) — skip, will retry")
                      totals["error"] += 1
                      continue
                  if real_branch != branch:
                      # genuinely a different pattern's PR — leave it unseen so
                      # the correct pattern processes it.
                      continue
                  seen.add(key)

                  sha = get_pr_sha(repo_full, pr_num)
                  if not sha:
                      print(f"  ? {label} could not fetch HEAD SHA")
                      totals["error"] += 1
                      continue

                  # 1. PATCH: ensure every listed file exists on the branch AND
                  #    matches canonical. Missing file → create it; drifted →
                  #    update it. If we pushed anything, or any write failed,
                  #    do NOT merge this round (an incomplete/failed rollout
                  #    must never merge).
                  pushed_any = False
                  write_failed = False
                  for path, canon_content in files.items():
                      status, current_content, file_sha = get_file_content_on_branch(repo_full, branch, path)
                      if status == "error":
                          # transient/permission error reading the file — never
                          # guess; skip this PR and let the next run retry.
                          print(f"  ! {label} could not read {path.split('/')[-1]} (API error) — skip, will retry")
                          write_failed = True
                          break
                      if status == "missing":
                          # genuine 404 — file absent on the branch (incomplete
                          # rollout); create it from canonical.
                          ok, err = patch_file(repo_full, branch, path, canon_content, None)
                          if ok:
                              print(f"  + {label} ADDED {path.split('/')[-1]} (was missing on branch)")
                              totals["patched"] += 1
                              pushed_any = True
                          else:
                              print(f"  ! {label} create failed for {path.split('/')[-1]}: {err}")
                              write_failed = True
                      elif current_content.strip() != canon_content.strip():
                          ok, err = patch_file(repo_full, branch, path, canon_content, file_sha)
                          if ok:
                              print(f"  ↑ {label} PATCHED {path.split('/')[-1]} (canonical drift → pushed)")
                              totals["patched"] += 1
                              pushed_any = True
                          else:
                              print(f"  ! {label} patch failed for {path.split('/')[-1]}: {err}")
                              write_failed = True
                  if write_failed:
                      totals["error"] += 1
                      continue  # never merge an incompletely-synced rollout
                  if pushed_any:
                      continue  # wait for Copilot to re-review the new push(es)

                  # 2. MERGE: only when CI clean + 0 Copilot findings
                  ci = check_runs_state(repo_full, sha)
                  if ci == "failed":
                      print(f"  ✗ {label} CI-FAILED — skip")
                      totals["failed"] += 1
                      continue
                  if ci in ("pending", "no-ci"):
                      print(f"  ⧖ {label} {ci.upper()} — wait")
                      totals["pending"] += 1
                      continue

                  n = copilot_count(repo_full, pr_num, sha)
                  if n < 0:
                      print(f"  ! {label} findings fetch error — skip")
                      totals["error"] += 1
                      continue
                  if n > 0:
                      print(f"  – {label} {n} finding(s) — wait for re-review")
                      totals["pending"] += 1
                      continue

                  ok, detail = merge_pr(repo_full, pr_num)
                  if ok:
                      print(f"  ✓ {label} MERGED")
                      totals["merged"] += 1
                  else:
                      print(f"  ! {label} merge failed: {detail}")
                      totals["error"] += 1

                  time.sleep(0.5)  # light pacing

          print(f"\n{'='*60}")
          print(f"Summary: {totals['merged']} merged, {totals['patched']} patched, "
                f"{totals['pending']} pending, {totals['failed']} CI-failed, "
                f"{totals['error']} errors")
          PYEOF
