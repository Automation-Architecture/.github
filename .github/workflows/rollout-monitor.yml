name: Rollout PR Monitor

# Read-only reporting. Never patch PRs, bypass protection, or arm auto-merge.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rollout-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report rollout PRs without changing them
        env:
          GH_TOKEN: ${{ secrets.AAA_ORG_TOKEN }}
          ORG: Automation-Architecture
        run: python3 scripts/rollout_monitor.py
