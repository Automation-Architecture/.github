name: Sentry Release on Merge

# Creates a Sentry release + production deploy record on every merged PR,
# tagged with the merge SHA and linked to the commit — so a new production
# error is auto-attributed to the exact PR. Post-merge guardrail half of the
# cloud autonomy pipeline (see aaa-runbooks spec/cloud-pr-automation-platform.md
# and spec/sentry-pipeline-integration.md).
#
# Activates ONLY where the repo-level Actions variable SENTRY_PROJECT is set
# (= that repo's Sentry project slug). No-ops cleanly everywhere else, so it is
# safe to roll out org-wide alongside auto-merge.yml / findings-fixer.yml.
#
# Error handling: the @sentry/nextjs build plugin may create the release first
# during the Vercel deploy, so a duplicate POST can come back "already exists" —
# that ONE case is tolerated. Every other non-2xx (401/403 bad token, 404 wrong
# org, 429 rate-limit, 5xx, network) FAILS the job loudly, so a broken guardrail
# is visible rather than silently skipped.
#
# Prereqs:
#   - SENTRY_TOKEN org secret (visibility: all)
#   - repo Actions variable SENTRY_PROJECT = the Sentry project slug

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  sentry-release:
    if: github.event.pull_request.merged == true && vars.SENTRY_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - name: Create Sentry release + deploy
        env:
          SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ORG: automation-architect
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_TOKEN:-}" ]; then
            echo "::warning::SENTRY_TOKEN org secret not set — skipping Sentry release."
            exit 0
          fi

          # POST <url> <json-body>. Tolerates ONLY the idempotent "already exists"
          # case (409 / body match); fails loudly on every other non-2xx so a
          # misconfigured token/org/rate-limit can't silently no-op the guardrail.
          post() {
            local code
            code=$(curl -s -o /tmp/sentry-resp -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SENTRY_TOKEN" -H "Content-Type: application/json" \
              "$1" -d "$2" || echo 000)
            echo "  $1 -> HTTP $code"
            case "$code" in
              2*) return 0 ;;
              409) echo "  (release already exists — tolerated)"; return 0 ;;
              4*)
                if grep -qiE 'already exists|already reported' /tmp/sentry-resp 2>/dev/null; then
                  echo "  (release already exists — tolerated)"; return 0
                fi
                echo "::error::Sentry API client error HTTP $code — check SENTRY_TOKEN / org slug / rate limit"
                cat /tmp/sentry-resp 2>/dev/null || true
                return 1 ;;
              *)
                echo "::error::Sentry API failure HTTP $code"
                cat /tmp/sentry-resp 2>/dev/null || true
                return 1 ;;
            esac
          }

          # Build bodies first — a jq failure fails the step (set -e) before any POST,
          # rather than sending an empty/invalid body. jq also makes the values
          # injection-safe.
          rel_body=$(jq -nc --arg v "$SHA" --arg p "$SENTRY_PROJECT" --arg r "$REPO" \
            '{version:$v, projects:[$p], refs:[{repository:$r, commit:$v}]}')
          dep_body=$(jq -nc --arg u "$PR_URL" '{environment:"production", url:$u}')

          post "https://sentry.io/api/0/organizations/$ORG/releases/" "$rel_body"
          post "https://sentry.io/api/0/organizations/$ORG/releases/$SHA/deploys/" "$dep_body"
          echo "Sentry release $SHA recorded for $SENTRY_PROJECT"
