name: Stale Snapshot PR Reaper

# Backstop for the automated-PR pileup. Some scheduled generators regenerate a
# data/status snapshot every run and open a NEW dated PR each time (husser's
# daily board sweep; the sprint-progress.json Jira sync). For each such
# "snapshot family" this keeps only the NEWEST open PR and closes + deletes the
# branches of the older, superseded ones.
#
# ⚠ SCOPE IS DELIBERATELY NARROW — an explicit allowlist of anchored title
# patterns AND bot authors. It will NEVER touch a human PR, a feature/fix PR, or
# a per-period deliverable. In particular the weekly `draft(weekly): funston`
# PRs are EXCLUDED on purpose: each week is DISTINCT content, not a regenerated
# snapshot, so an older week is not "superseded" by a newer one.
#
# Adding a family: only add a pattern after confirming it is a REGENERATED
# same-content snapshot where older runs are genuinely obsolete. When unsure,
# leave it out — a missed family is cheap; a wrongly-closed deliverable is not.
#
# This is a BACKSTOP, not the fix. The real fix is generators updating ONE
# rolling PR (fixed branch) or writing data directly instead of PR-ing a fresh
# snapshot each run — see docs/snapshot-generators.md.
#
# Prereq: AAA_ORG_TOKEN needs pull-requests:write + contents:write on org repos.
# If it lacks them every close fails and the job fails loudly (by design — a
# reaper that silently does nothing is the failure mode we're avoiding).
#
# Read failures fail the run too (GAAA-3938): if `gh repo list` fails or returns
# nothing, the run stops red before touching anything; if `gh pr list` fails for
# a repo (or returns something that is not a JSON array), that repo is recorded,
# the other repos are still reaped as usual, and the run ends red. A read error
# must never look like "nothing to reap".
#
# Tests: tests/stale-snapshot-reaper/ (offline, stub gh), run by
# stale-snapshot-reaper-tests.yml.

on:
  schedule:
    - cron: '30 14 * * *'   # 14:30 UTC daily — ~90 min after the 8am ET (≈12:00 UTC) generators run
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: list what WOULD be closed, close nothing.'
        type: boolean
        default: false

permissions:
  contents: read   # actual writes use AAA_ORG_TOKEN, not GITHUB_TOKEN

concurrency:
  group: snapshot-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.AAA_ORG_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Reap superseded snapshot PRs
        run: |
          set -uo pipefail

          # --- ALLOWLIST (anchored). Title must match one of these AND author a bot. ---
          TITLE_PAT='^chore(\(husser\))?: daily board sweep|^chore: sync sprint-progress\.json'
          BOT_PAT='^(web3sea|aaa-dashboard-bot|github-actions)'

          # A failed or empty org listing stops the run red: an empty list would
          # otherwise read as "nothing to reap".
          if ! repos=$(gh repo list Automation-Architecture --no-archived --limit 500 \
                         --json nameWithOwner --jq '.[].nameWithOwner'); then
            echo "::error::gh repo list failed; cannot tell which repos to check. Check AAA_ORG_TOKEN and the GitHub API status."
            exit 1
          fi
          if [ -z "$repos" ]; then
            echo "::error::gh repo list returned no repositories; refusing to report 'nothing to reap'. Check AAA_ORG_TOKEN."
            exit 1
          fi

          : > actions.md
          : > read-errors.md
          echo "DRY_RUN=$DRY_RUN"

          for repo in $repos; do
            # A failed PR listing is recorded (the run ends red below) and the
            # repo is skipped; the other repos are still reaped.
            if ! prs=$(gh pr list --repo "$repo" --state open --limit 200 \
                         --json number,title,author,createdAt,headRefName); then
              echo "- READ-FAILED $repo (gh pr list failed)" >> read-errors.md
              continue
            fi
            # `--json` always prints at least `[]`; empty stdout with a zero exit is
            # a broken read, and jq would turn it into an empty (green) plan.
            if [ -z "$prs" ]; then
              echo "- READ-FAILED $repo (gh pr list returned no output)" >> read-errors.md
              continue
            fi
            # Group matching PRs into families (title with digits/punct stripped);
            # within each family keep the newest, mark the rest to close.
            if ! plan=$(printf '%s' "$prs" | jq -c --arg pat "$TITLE_PAT" --arg bots "$BOT_PAT" '
                       def famkey: (.title|ascii_downcase|gsub("[0-9]";"")|gsub("[-_/(),.]";" ")|gsub("\\s+";" ")|gsub("^ | $";""));
                       if type != "array" then error("gh pr list did not return a JSON array") else . end
                       | [ .[] | select((.title|test($pat;"i")) and (.author.login|test($bots))) ]
                       | group_by(famkey)
                       | map(sort_by(.createdAt) | {keep: .[-1].number, close: [.[:-1][] | {number, headRefName}]})
                       | map(select(.close|length > 0))
                     '); then
              echo "- READ-FAILED $repo (gh pr list output was not a JSON array of PRs)" >> read-errors.md
              continue
            fi
            if [ -z "$plan" ]; then
              echo "- READ-FAILED $repo (no plan computed from gh pr list output)" >> read-errors.md
              continue
            fi
            [ "$plan" = "[]" ] && continue

            echo "$plan" | jq -c '.[]' | while read -r fam; do
              keep=$(printf '%s' "$fam" | jq -r '.keep')
              printf '%s' "$fam" | jq -c '.close[]' | while read -r item; do
                num=$(printf '%s' "$item" | jq -r '.number')
                br=$(printf '%s' "$item" | jq -r '.headRefName')
                if [ "$DRY_RUN" = "true" ]; then
                  echo "- [dry-run] $repo #$num (branch \`$br\`) — superseded by #$keep" >> actions.md
                  continue
                fi
                if gh pr close "$num" --repo "$repo" \
                     --comment "Closing as **superseded** by #$keep — this is a regenerated snapshot, so only the newest is current. Auto-managed by the Stale Snapshot PR Reaper (\`.github/workflows/stale-snapshot-reaper.yml\`). Reopen if you need this specific run." >/dev/null 2>&1; then
                  gh api -X DELETE "repos/$repo/git/refs/heads/$br" >/dev/null 2>&1 || true
                  echo "- closed $repo #$num (superseded by #$keep)" >> actions.md
                else
                  echo "- FAILED $repo #$num" >> actions.md
                fi
              done
            done
          done

          # The pipe-fed while loops run in subshells, so tally from the file.
          # (grep -c prints 0 and exits 1 on no match, so `|| true`, not `|| echo 0`.)
          scanned=$(printf '%s\n' "$repos" | grep -c . || true)
          closed=$(grep -c '^- closed'   actions.md || true)
          failed=$(grep -c '^- FAILED'   actions.md || true)
          dry=$(grep -c '^- \[dry-run\]' actions.md || true)
          unread=$(grep -c '^- READ-FAILED' read-errors.md || true)
          echo "=== Reaper summary: repos=$scanned  unreadable=$unread  closed=$closed  failed=$failed  dry_run_would_close=$dry ==="
          if [ -s actions.md ]; then cat actions.md; else echo "(no actions)"; fi
          cat read-errors.md

          status=0
          if [ "${failed:-0}" -gt 0 ]; then
            echo "::error::Reaper failed to close $failed PR(s) — verify AAA_ORG_TOKEN has pull-requests:write + contents:write on org repos."
            status=1
          fi
          if [ "${unread:-0}" -gt 0 ]; then
            echo "::error::Could not read open PRs in $unread of $scanned repo(s); those repos were not reaped (listed above)."
            status=1
          fi
          exit "$status"
